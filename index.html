<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyPSE — Le carnet numérique du secouriste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --surface-2:      #f2f4f9;
    --card:           #ffffff;
    --text-primary:   #0b0f19;
    --text-secondary: #52586b;
    --text-muted:     #8a90a3;
    --border:         rgba(11,15,25,0.09);
    --gridline:       #e3e6ee;
    /* ---------- Charte graphique MyPSE (fournie le 20/08/2026) ----------
       Couleurs officielles : bleu marine #0D1B2A, rouge secours #E63946,
       bleu acier #415A77, gris clair #F1F3F5, vert validé #00B050.
       Les variables ci-dessous conservent leurs anciens noms (--blue, --indigo,
       --teal, --coral, --amber…) pour ne rien casser dans logic_new.js, mais
       pointent maintenant vers les couleurs de la charte officielle. */
    --blue:           #0D1B2A; /* bleu marine — couleur principale */
    --blue-dark:      #081119;
    --blue-light:     #e6e9ee;
    --good:           #00B050; /* vert validé */
    --good-light:     #e1f5e9;
    --warning:        #e08e00;
    --warning-light:  #fff2da;
    --serious:        #ec835a;
    --critical:       #E63946; /* rouge secours */
    --critical-light: #fbe3e5;
    --navy-950:       #070d16;
    --navy-900:       #0D1B2A; /* bleu marine — exact charte */
    --navy-800:       #16283f;
    --navy-700:       #1e3350;
    --sidebar-text:   #aab6cc;
    --sidebar-w:      252px;
    /* Accents supplémentaires — code couleur cohérent par fonction (PSC / PSE1 / PSE2) réutilisé
       dans les cartes d'accueil, badges, barres latérales de carte et pastilles de navigation.
       Repris dans la famille bleu marine / bleu acier de la charte MyPSE (PSC : bleu acier clair,
       PSE1 : bleu marine, PSE2 : rouge secours), plus le vert validé et un amber neutre pour les
       états d'avancement (« en cours »), qui ne fait pas partie des couleurs de marque mais reste
       une convention d'interface courante. */
    --teal:           #6B84A3; /* bleu acier clair — accent PSC */
    --teal-dark:      #52698a;
    --teal-light:     #eef1f5;
    --indigo:         #415A77; /* bleu acier — couleur secondaire de la charte, accent PSE2 */
    --indigo-dark:    #2e4159;
    --indigo-light:   #e9edf1;
    --coral:          #E63946; /* rouge secours — accent CTA / bouton important */
    --coral-dark:     #b32836;
    --coral-light:    #fbe3e5;
    --amber:          #f0a202;
    --amber-dark:     #b97600;
    --shadow-sm:      0 1px 2px rgba(15,30,53,0.05);
    --shadow-md:      0 4px 16px rgba(15,30,53,0.08);
    --shadow-lg:      0 10px 32px rgba(15,30,53,0.14);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background:
      radial-gradient(circle at 100% 0%, rgba(13,27,42,0.05), transparent 32%),
      radial-gradient(circle at 0% 100%, rgba(65,90,119,0.045), transparent 30%),
      var(--surface-2);
    background-attachment: fixed;
    color: var(--text-primary);
    font-family: 'Montserrat', system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100vh; }
  /* ---------- icônes SVG inline (formes géométriques simples, pas d'illustration copiée) ---------- */
  svg.ico { flex: none; display: block; }
  .icon-chip {
    flex: none; width: 38px; height: 38px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    background: var(--blue-light); color: var(--blue-dark);
  }
  .icon-chip.sm { width: 30px; height: 30px; border-radius: 9px; }
  .icon-chip.lg { width: 48px; height: 48px; border-radius: 13px; }
  .icon-chip.teal    { background: var(--teal-light);    color: var(--teal-dark); }
  .icon-chip.indigo  { background: var(--indigo-light);  color: var(--indigo-dark); }
  .icon-chip.coral   { background: var(--coral-light);   color: var(--coral-dark); }
  .icon-chip.amber   { background: var(--warning-light); color: var(--amber-dark); }
  .icon-chip.good    { background: var(--good-light);    color: var(--good); }
  .icon-chip.critical{ background: var(--critical-light);color: var(--critical); }
  .icon-chip.muted   { background: var(--surface-2);     color: var(--text-muted); }

  /* ---------- shell layout ---------- */
  .shell { display: flex; min-height: 100vh; }
  .sidebar {
    width: var(--sidebar-w);
    flex: none;
    background:
      radial-gradient(circle at 15% 0%, rgba(13,27,42,0.22), transparent 40%),
      radial-gradient(circle at 100% 85%, rgba(65,90,119,0.18), transparent 45%),
      linear-gradient(180deg, var(--navy-950), var(--navy-900) 60%, var(--navy-800));
    color: #fff;
    display: flex;
    flex-direction: column;
    padding: 18px 14px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .sidebar .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px 20px;
  }
  .sidebar .brand .mark {
    width: 36px; height: 36px;
    border-radius: 10px;
    box-shadow: 0 3px 10px rgba(13,27,42,0.4);
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    flex: none;
    overflow: hidden;
  }
  .sidebar .brand .mark img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .brand-logo-img { display: block; height: 32px; width: auto; }
  .sidebar .brand .name { font-size: 14.5px; font-weight: 800; line-height: 1.2; color: #fff; }
  .sidebar .brand .sub { font-size: 10.5px; color: var(--sidebar-text); letter-spacing: 0.04em; text-transform: uppercase; }
  .sidebar .nav-group-label {
    display: flex; align-items: center; gap: 7px;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #6c7794;
    padding: 16px 10px 7px;
  }
  .sidebar .nav-group-label::before {
    content: ""; width: 5px; height: 5px; border-radius: 999px;
    background: linear-gradient(135deg, var(--blue), var(--indigo));
    flex: none;
  }
  .sidebar nav.side-nav { display: flex; flex-direction: column; gap: 2px; }
  .sidebar nav.side-nav button {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    border-left: 2.5px solid transparent;
    color: var(--sidebar-text);
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 10px;
    border-radius: 0 9px 9px 0;
    cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  .sidebar nav.side-nav button:hover:not(:disabled) { background: rgba(255,255,255,0.07); color: #fff; }
  .sidebar nav.side-nav button.active {
    background: linear-gradient(90deg, rgba(13,27,42,0.45), rgba(65,90,119,0.20));
    color: #fff;
    border-left-color: var(--critical);
  }
  .sidebar nav.side-nav button:disabled { color: #4a5266; cursor: default; }
  .sidebar nav.side-nav button .ic {
    flex: none; width: 26px; height: 26px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.08);
    color: #cfd8ea;
  }
  .sidebar nav.side-nav button.active .ic { background: rgba(255,255,255,0.20); color: #fff; }
  .sidebar nav.side-nav button .soon {
    margin-left: auto;
    font-size: 9px;
    font-weight: 700;
    background: rgba(255,255,255,0.10);
    color: var(--sidebar-text);
    padding: 2px 6px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .sidebar .spacer { flex: 1; }
  .sidebar .account-box {
    border-top: 1px solid rgba(255,255,255,0.08);
    padding-top: 12px;
    margin-top: 12px;
  }
  .sidebar .account-box .who { display: flex; align-items: center; gap: 9px; padding: 6px 8px 10px; }
  .sidebar .account-box .avatar {
    width: 32px; height: 32px; border-radius: 999px;
    background: linear-gradient(135deg, var(--indigo), var(--blue-dark)); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex: none;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .sidebar .account-box .name { font-size: 12.5px; font-weight: 700; color: #fff; line-height: 1.3; }
  .sidebar .account-box .role { font-size: 10.5px; color: var(--sidebar-text); }
  .sidebar .account-box button {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.10);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .sidebar .ref-badge {
    margin: 4px 8px 0;
    font-size: 10px;
    color: var(--sidebar-text);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 7px 9px;
    line-height: 1.5;
  }

  .topbar {
    display: none;
    align-items: center;
    justify-content: space-between;
    background: var(--navy-900);
    color: #fff;
    padding: 12px 16px;
  }
  .topbar .brand-mini { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; }
  .topbar button.burger {
    background: rgba(255,255,255,0.08);
    border: none; color: #fff; border-radius: 8px;
    width: 34px; height: 34px; font-size: 16px; cursor: pointer;
  }

  .content { flex: 1; min-width: 0; }
  .app { max-width: 780px; margin: 0 auto; padding: 28px 24px 64px; }

  @media (max-width: 860px) {
    .sidebar { display: none; }
    .sidebar.open {
      display: flex; position: fixed; z-index: 40; left: 0; top: 0; width: 82vw; max-width: 300px; box-shadow: 0 0 0 2000px rgba(0,0,0,0.45);
    }
    .topbar { display: flex; }
    .app { padding: 18px 14px 48px; }
  }

  /* ---------- generic components ---------- */
  .disclaimer {
    background: #fff8e6;
    border: 1px solid #f0dca0;
    color: #5c4a12;
    font-size: 12.5px;
    line-height: 1.5;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 18px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
    border-top: 3px solid transparent;
    transition: box-shadow .15s ease;
  }
  .card.accent-blue   { border-top-color: var(--blue); }
  .card.accent-teal   { border-top-color: var(--teal); }
  .card.accent-indigo { border-top-color: var(--indigo); }
  .card.accent-coral  { border-top-color: var(--coral); }
  .card.accent-good   { border-top-color: var(--good); }
  h2 { font-size: 17px; margin: 0 0 12px; letter-spacing: -0.01em; font-weight: 700; }
  h3 { font-size: 12.5px; margin: 0 0 8px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700; }
  .page-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 20px; }
  .page-header .icon-chip { margin-top: 1px; }
  .page-header .page-title { margin: 0 0 4px; }
  .page-header .page-sub { margin: 0; }
  .page-title { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 4px; }
  .page-sub { font-size: 13.5px; color: var(--text-secondary); margin: 0 0 20px; line-height: 1.5; }
  /* ---------- Barre d'onglets "Questionnaires" (remplace l'ex-barre de confiance, 29/08/2026) ---------- */
  .qtab-bar { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 4px; }
  .qtab {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--border); background: var(--card); border-radius: 999px;
    padding: 9px 16px; font-size: 13px; font-weight: 700; color: var(--text-secondary);
    cursor: pointer; transition: transform .1s ease, box-shadow .1s ease;
  }
  .qtab:hover:not(:disabled) { box-shadow: var(--shadow-sm); }
  .qtab.active { background: linear-gradient(135deg, var(--blue), var(--blue-dark)); border-color: transparent; color: #fff; box-shadow: 0 2px 8px rgba(13,27,42,0.35); }
  .qtab.locked, .qtab:disabled { color: var(--text-muted); cursor: default; opacity: 0.7; }
  .qtab svg { flex: none; }
  /* ---------- "Mon parcours" — frise horizontale ---------- */
  .parcours-frise { display: flex; align-items: flex-start; overflow-x: auto; padding: 6px 2px 8px; -webkit-overflow-scrolling: touch; }
  .parcours-node { flex: none; width: 116px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .parcours-node .pn-dot {
    width: 32px; height: 32px; border-radius: 999px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 13.5px; font-weight: 800; color: #fff;
    background: var(--text-muted); border: 3px solid var(--card);
    box-shadow: 0 0 0 1px var(--border);
  }
  .parcours-node.valide .pn-dot { background: var(--good); box-shadow: 0 0 0 1px var(--good); }
  .parcours-node.en_cours .pn-dot { background: var(--warning); box-shadow: 0 0 0 1px var(--warning); }
  .parcours-node.a_venir .pn-dot { background: var(--surface-2); color: var(--text-muted); box-shadow: 0 0 0 1px var(--border); }
  .parcours-node.current .pn-dot { box-shadow: 0 0 0 3px rgba(13,27,42,0.16); }
  .parcours-node .pn-label { font-size: 11px; font-weight: 700; margin-top: 8px; line-height: 1.3; max-width: 106px; }
  .parcours-node.current .pn-label { color: var(--blue); }
  .parcours-node .pn-date { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
  .parcours-connector { flex: 1 1 24px; min-width: 24px; height: 3px; background: var(--border); margin-top: 14px; border-radius: 999px; }
  .parcours-connector.done { background: var(--good); }
  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }
  .field label.field-label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; }
  .field p.help { font-size: 12px; color: var(--text-muted); margin: 4px 0 0; }
  .choice-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--border);
    background: var(--surface-1);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    user-select: none;
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .chip:hover { box-shadow: var(--shadow-sm); }
  .chip.selected { background: linear-gradient(135deg, var(--blue), var(--blue-dark)); border-color: transparent; color: #fff; box-shadow: 0 2px 8px rgba(13,27,42,0.35); }
  .theme-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: none; border-radius: 10px; padding: 11px 18px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    background: var(--blue); color: #fff;
    box-shadow: 0 2px 6px rgba(13,27,42,0.3);
    transition: transform .1s ease, box-shadow .1s ease, filter .1s ease;
  }
  .btn:hover:not(:disabled) { filter: brightness(1.06); box-shadow: 0 3px 10px rgba(13,27,42,0.4); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn.primary {
    background: linear-gradient(135deg, var(--coral), var(--coral-dark));
    box-shadow: 0 3px 10px rgba(230,57,70,0.35);
  }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.05); box-shadow: 0 4px 14px rgba(230,57,70,0.45); }
  .btn.secondary { background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); box-shadow: none; }
  .btn.secondary:hover:not(:disabled) { background: #fff; box-shadow: var(--shadow-sm); filter: none; }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
  select, input[type=number] {
    font-family: inherit; font-size: 14px; padding: 8px 10px;
    border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-primary);
  }
  .quiz-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--text-muted); margin-bottom: 10px; }
  .tagset { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
    padding: 3px 8px; border-radius: 999px;
    background: var(--surface-1); color: var(--text-secondary); border: 1px solid var(--border);
  }
  .tag.tag-blue   { background: var(--blue-light);    color: var(--blue-dark);   border-color: transparent; }
  .tag.tag-teal   { background: var(--teal-light);    color: var(--teal-dark);   border-color: transparent; }
  .tag.tag-indigo { background: var(--indigo-light);  color: var(--indigo-dark); border-color: transparent; }
  .tag.tag-good   { background: var(--good-light);    color: var(--good);        border-color: transparent; }
  .tag.tag-warn   { background: var(--warning-light); color: var(--amber-dark);  border-color: transparent; }
  .progressbar-outer { height: 7px; background: var(--gridline); border-radius: 999px; overflow: hidden; margin-bottom: 18px; }
  .progressbar-inner { height: 100%; background: linear-gradient(90deg, var(--blue), var(--indigo)); border-radius: 999px; transition: width .25s ease; }
  .timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px; }
  .timer.low { color: var(--critical); }
  .qtext { font-size: 16px; font-weight: 600; line-height: 1.45; margin: 0 0 16px; }
  .scenario-box { background: var(--blue-light); border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.5; margin-bottom: 16px; color: #0d2c52; }
  ul.options { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  ul.options li { border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: 14px; cursor: pointer; line-height: 1.4; display: flex; align-items: flex-start; gap: 10px; }
  ul.options li .box { flex: none; width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--text-muted); margin-top: 1px; }
  ul.options li.selected { border-color: var(--blue); background: #f2f7fd; }
  ul.options li.selected .box { background: var(--blue); border-color: var(--blue); }
  ul.options li.correct { border-color: var(--good); background: #eefaea; }
  ul.options li.correct .box { background: var(--good); border-color: var(--good); }
  ul.options li.incorrect { border-color: var(--critical); background: #fdeeee; }
  ul.options li.incorrect .box { background: var(--critical); border-color: var(--critical); }
  ol.order-list { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  ol.order-list li { border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; display: flex; align-items: center; gap: 10px; background: var(--surface-1); }
  ol.order-list li .rank { flex: none; width: 24px; height: 24px; border-radius: 999px; background: var(--blue); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  ol.order-list li .txt { flex: 1; line-height: 1.4; }
  ol.order-list li .moves { display: flex; flex-direction: column; gap: 3px; }
  ol.order-list li .moves button { border: 1px solid var(--border); background: #fff; border-radius: 6px; width: 26px; height: 22px; font-size: 11px; cursor: pointer; }
  ol.order-list li.correct { border-color: var(--good); background: #eefaea; }
  ol.order-list li.correct .rank { background: var(--good); }
  ol.order-list li.incorrect-pos { border-color: var(--critical); background: #fdeeee; }
  ol.order-list li.incorrect-pos .rank { background: var(--critical); }
  .text-input { font-family: inherit; }
  .text-input.correct { border-color: var(--good); background: #eefaea; }
  .text-input.incorrect { border-color: var(--critical); background: #fdeeee; }
  .feedback { border-radius: 10px; padding: 12px 14px; font-size: 13.5px; line-height: 1.55; margin-bottom: 16px; }
  .feedback.ok { background: #eefaea; color: #0a4a0a; border: 1px solid #bfe8bf; }
  .feedback.ko { background: #fdeeee; color: #6e1414; border: 1px solid #f2c2c2; }
  .feedback .fb-title { font-weight: 700; display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .actions-row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .stat-tile { border: 1px solid var(--border); border-radius: 12px; padding: 14px; background: linear-gradient(160deg, var(--surface-1), var(--card)); transition: box-shadow .12s ease; }
  .stat-tile:hover { box-shadow: var(--shadow-sm); }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 4px; }
  .stat-tile .val { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; background: linear-gradient(135deg, var(--text-primary), var(--blue-dark)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stat-tile .lbl { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .theme-row { display: flex; align-items: center; gap: 10px; font-size: 13px; margin-bottom: 10px; }
  .theme-row .name { flex: none; width: 190px; color: var(--text-secondary); font-weight: 600; }
  .theme-row .bar-outer { flex: 1; height: 10px; background: var(--gridline); border-radius: 999px; overflow: hidden; }
  .theme-row .bar-inner { height: 100%; background: linear-gradient(90deg, var(--blue), var(--indigo)); border-radius: 999px; }
  /* ---------- Ajouté le 20/08/2026 (soir) : code couleur des barres de progression par maîtrise ----------
     Rouge (< 10%) / orange (10-49%) / jaune (50-89%) / vert (>= 90%), pour que l'utilisateur repère
     immédiatement où travailler en priorité, sur toutes les vues (Ma progression, Personnels, etc.). */
  .theme-row .bar-inner.pc-red    { background: linear-gradient(90deg, var(--critical), var(--coral-dark)); }
  .theme-row .bar-inner.pc-orange { background: linear-gradient(90deg, #f0a202, #c97e00); }
  .theme-row .bar-inner.pc-yellow { background: linear-gradient(90deg, #e8c400, #c9a700); }
  .theme-row .bar-inner.pc-green  { background: linear-gradient(90deg, var(--good), #067f06); }
  .theme-row .pct { flex: none; width: 42px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-muted); }
  .empty-state { text-align: center; color: var(--text-muted); font-size: 13.5px; padding: 30px 10px; }
  .empty-state .icon-chip { margin: 0 auto 12px; }
  footer.note { text-align: center; font-size: 11.5px; color: var(--text-muted); margin-top: 26px; line-height: 1.6; }
  .hidden { display: none !important; }
  @media (max-width: 480px) {
    .theme-row .name { width: 120px; font-size: 12px; }
  }

  /* ---------- level picker (home) ---------- */
  .level-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .level-card {
    border-radius: 16px; padding: 22px; cursor: pointer; color: #fff;
    position: relative; overflow: hidden; min-height: 138px;
    display: flex; flex-direction: column; justify-content: flex-end;
    box-shadow: var(--shadow-md);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .level-card:not(.locked):hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  .level-card::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 88% -10%, rgba(255,255,255,0.22), transparent 45%),
      radial-gradient(circle at -10% 110%, rgba(255,255,255,0.12), transparent 40%);
    pointer-events: none;
  }
  .level-card .lc-icon {
    position: relative; width: 34px; height: 34px; border-radius: 10px; margin-bottom: 10px; flex: none;
    background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center;
  }
  .level-card.psc { background: linear-gradient(135deg, var(--teal), var(--teal-dark)); }
  .level-card.pse1 { background: linear-gradient(135deg, var(--blue), var(--navy-800)); }
  .level-card.pse2 { background: linear-gradient(135deg, var(--indigo), var(--indigo-dark)); }
  .level-card .lc-title { font-size: 19px; font-weight: 800; margin-bottom: 4px; position: relative; }
  .level-card .lc-sub { font-size: 12.5px; opacity: 0.88; position: relative; }
  .level-card .lc-badge {
    position: absolute; top: 14px; right: 14px; font-size: 10px; font-weight: 700;
    background: rgba(255,255,255,0.18); padding: 3px 8px; border-radius: 999px; text-transform: uppercase;
  }
  .level-card.expanded { outline: 3px solid rgba(255,255,255,0.55); outline-offset: 2px; }
  .level-card.locked {
    cursor: default; opacity: 0.6; filter: grayscale(0.6);
    background: linear-gradient(135deg, #5a6172, #33384a);
    box-shadow: none;
  }
  .level-card.locked .lc-badge { background: rgba(0,0,0,0.28); }

  /* ---------- wizard ---------- */
  .stepper { display: flex; align-items: center; margin-bottom: 22px; flex-wrap: wrap; gap: 4px; }
  .stepper .step-dot {
    display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 4px;
  }
  .stepper .step-dot .n {
    width: 24px; height: 24px; border-radius: 999px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 11.5px; font-weight: 700;
    background: var(--gridline); color: var(--text-muted);
  }
  .stepper .step-dot.done .n { background: linear-gradient(135deg, var(--good), #067f06); color: #fff; }
  .stepper .step-dot.current .n { background: linear-gradient(135deg, var(--blue), var(--indigo)); color: #fff; }
  .stepper .step-dot .lbl { font-size: 12px; font-weight: 600; color: var(--text-muted); }
  .stepper .step-dot.current .lbl { color: var(--text-primary); }
  .stepper .step-line { flex: 1; height: 1px; background: var(--gridline); min-width: 10px; margin: 0 4px; }

  /* ---------- auth screen ---------- */
  .auth-shell { min-height: 100vh; display: flex; }
  .auth-hero {
    flex: 1.1;
    background:
      radial-gradient(circle at 15% 20%, rgba(13,27,42,0.4), transparent 45%),
      radial-gradient(circle at 85% 75%, rgba(107,132,163,0.32), transparent 50%),
      linear-gradient(160deg, var(--navy-950), var(--navy-800) 70%);
    color: #fff;
    display: flex; flex-direction: column; justify-content: center;
    padding: 60px 56px;
    position: relative;
    overflow: hidden;
  }
  .auth-hero::before, .auth-hero::after {
    content: ""; position: absolute; border-radius: 999px;
    background: rgba(255,255,255,0.05);
  }
  .auth-hero::before { width: 420px; height: 420px; top: -120px; left: -140px; }
  .auth-hero::after { width: 300px; height: 300px; bottom: -100px; right: -80px; background: rgba(255,255,255,0.04); }
  .auth-hero .pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.14);
    padding: 6px 12px; border-radius: 999px; font-size: 11.5px; font-weight: 700;
    margin-bottom: 22px; width: fit-content;
  }
  .auth-hero .auth-logo { height: 92px; width: auto; max-width: 220px; align-self: flex-start; object-fit: contain; margin-bottom: 26px; position: relative; filter: drop-shadow(0 8px 20px rgba(0,0,0,0.4)); }
  .auth-hero h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 14px; max-width: 460px; position: relative; }
  .auth-hero p.lead { font-size: 14.5px; line-height: 1.6; color: #c7d2e0; max-width: 420px; margin: 0 0 26px; position: relative; }
  .auth-hero .feat-row { display: flex; gap: 22px; flex-wrap: wrap; position: relative; }
  .auth-hero .feat { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #dbe3ef; }
  .auth-hero .feat .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--critical); flex: none; }
  .auth-panel {
    flex: 0 0 440px;
    max-width: 92vw;
    background: #fff;
    display: flex; flex-direction: column; justify-content: center;
    padding: 40px;
  }
  @media (max-width: 860px) {
    .auth-shell { flex-direction: column; }
    .auth-hero { padding: 40px 26px; min-height: 260px; }
    .auth-hero h1 { font-size: 26px; }
    .auth-panel { flex: 1; max-width: 100%; }
  }
</style>

<body>
<div id="app-root"></div>

<script>

const THEMES = [
  { id: "securite",     label: "Protection / sécurité",        level: "PSE1" },
  { id: "alerte",       label: "Alerte",                        level: "PSE1" },
  { id: "bilan",        label: "Bilans",                        level: "PSE1" },
  { id: "hemorragies",  label: "Hémorragies",                   level: "PSE1" },
  { id: "obstruction",  label: "Obstruction des voies aériennes", level: "PSE1" },
  { id: "malaises",     label: "Malaises",                      level: "PSE1" },
  { id: "plaies",       label: "Plaies",                        level: "PSE1" },
  { id: "brulures",     label: "Brûlures",                      level: "PSE1" },
  { id: "traumatismes", label: "Traumatismes",                  level: "PSE1" },
  { id: "lva_pls",      label: "Perte de connaissance / PLS",   level: "PSE1" },
  { id: "acr_dae",      label: "Arrêt cardiaque / RCP / DAE",   level: "PSE1" },
  { id: "divers_pse1",  label: "Divers PSE1",                   level: "PSE1" },
  { id: "detresses",    label: "Détresses vitales (PSE2)",      level: "PSE2" },
  { id: "traumato_avancee", label: "Traumatologie avancée",     level: "PSE2" },
  { id: "obstetrique",  label: "Accouchement inopiné",          level: "PSE2" },
  { id: "intoxications",label: "Intoxications",                 level: "PSE2" },
  { id: "noyade_elec",  label: "Noyade / Électrisation",        level: "PSE2" },
  { id: "materiel_o2",  label: "Matériel & oxygénothérapie",    level: "PSE1" },
  { id: "bilan_transmission", label: "Bilan approfondi & transmission", level: "PSE2" },
  { id: "multi_victimes", label: "Victimes multiples",          level: "PSE1" },
  { id: "attitude_comportement", label: "Attitude et comportement", level: "PSE1" },
];

const QUESTIONS = [

// ---------- SÉCURITÉ / PROTECTION ----------
{ level:"PSE1", theme:"securite", difficulty:"facile", type:"qcm",
  q:"Vous arrivez sur les lieux d'un accident de la route. Quelle est la toute première action à réaliser ?",
  choices:["Examiner immédiatement la victime la plus atteinte","Assurer la protection : sécuriser la zone pour vous-même, la victime et les tiers","Appeler directement le SAMU avant toute autre chose","Déplacer la victime hors de la route"],
  correct:[1],
  explanation:"Avant tout geste, le secouriste doit assurer sa propre sécurité et celle des témoins/victimes (baliser, couper le contact, s'éloigner d'un danger persistant...). Un secouriste blessé ne peut plus porter secours." },
{ level:"PSE1", theme:"securite", difficulty:"moyen", type:"qcm",
  q:"Un danger identifié (fuite de gaz, incendie, câble électrique au sol...) ne peut pas être supprimé. Que devez-vous faire ?",
  choices:["Intervenir rapidement quand même car la victime est prioritaire","Ne pas s'approcher, baliser la zone à distance de sécurité et alerter les services spécialisés","Demander à un témoin non formé de désamorcer le danger","Ignorer le danger s'il semble faible"],
  correct:[1],
  explanation:"Si le danger ne peut pas être écarté, on ne s'approche pas de la victime : on baliser/isoler la zone à distance et on alerte les services compétents (pompiers, ENEDIS, GRDF...)." },
{ level:"PSE1", theme:"securite", difficulty:"difficile", type:"order",
  scenario:"Sur la voie publique, un cycliste vient d'être renversé par une voiture. Le trafic continue de circuler. Mettez dans l'ordre les actions du secouriste isolé.",
  actions:[
    "Se garer en sécurité et allumer les feux de détresse",
    "Baliser la zone (triangle, gilet, signalisation) pour protéger la victime et les autres usagers",
    "S'approcher de la victime et réaliser un premier bilan rapide (conscience, respiration)",
    "Faire alerter les secours en donnant les informations précises (lieu, nombre de victimes, état)",
    "Réaliser les gestes de secours nécessaires en fonction du bilan",
    "Surveiller la victime jusqu'à l'arrivée des secours"],
  explanation:"La protection du sur-accident passe toujours avant l'approche de la victime : on sécurise la zone avant d'examiner, puis on alerte et on agit, en surveillant en continu." },

// ---------- ALERTE ----------
{ level:"PSE1", theme:"alerte", difficulty:"facile", type:"qcm",
  q:"Quel numéro d'urgence permet de joindre directement les sapeurs-pompiers en France ?",
  choices:["15","17","18","112 uniquement"],
  correct:[2],
  explanation:"Le 18 joint les sapeurs-pompiers, le 15 le SAMU (aide médicale urgente), le 17 la police/gendarmerie, et le 112 est le numéro d'urgence européen unique valable pour tous les services." },
{ level:"PSE1", theme:"alerte", difficulty:"moyen", type:"qcm",
  q:"Quelles informations sont indispensables à transmettre lors d'un message d'alerte ? (plusieurs réponses possibles)",
  choices:["Le lieu précis de l'intervention","La nature de l'événement et le nombre de victimes","L'état apparent des victimes et les premiers gestes réalisés","Vos coordonnées personnelles complètes de sécurité sociale"],
  correct:[0,1,2],
  explanation:"Un message d'alerte efficace précise : qui appelle, quoi (nature), où (lieu précis), combien de victimes et leur état, et ce qui a déjà été fait. Les données administratives type sécurité sociale ne sont pas nécessaires à ce stade." },
{ level:"PSE1", theme:"alerte", difficulty:"facile", type:"qcm",
  q:"Après avoir donné votre message d'alerte au régulateur, que devez-vous faire ?",
  choices:["Raccrocher immédiatement pour retourner vers la victime","Attendre que ce soit le régulateur qui raccroche en premier, en suivant ses consignes","Rappeler systématiquement 2 minutes après","Couper votre téléphone pour économiser la batterie"],
  correct:[1],
  explanation:"On ne raccroche jamais le premier : le régulateur peut avoir besoin de précisions ou vous donner des consignes (gestes à réaliser en attendant les secours)." },

// ---------- BILANS ----------
{ level:"PSE1", theme:"bilan", difficulty:"moyen", type:"qcm",
  q:"Le bilan primaire (recherche d'une urgence vitale) est souvent résumé par l'acronyme X-A-B-C-D. Que recherche-t-on en premier (X) ?",
  choices:["Une détresse respiratoire","Une hémorragie externe massive qui met en jeu le pronostic vital immédiat","Le niveau de conscience","La présence d'un pouls"],
  correct:[1],
  explanation:"Le X du bilan primaire correspond à la recherche et au traitement immédiat d'une hémorragie externe massive (« ce qui tue le plus vite »), avant même les voies aériennes, la respiration, la circulation et la conscience." },
{ level:"PSE1", theme:"bilan", difficulty:"difficile", type:"order",
  scenario:"Vous devez réaliser le bilan primaire d'une victime inconsciente. Remettez dans l'ordre les étapes du bilan X-A-B-C-D.",
  actions:[
    "X — Rechercher une hémorragie externe massive et la traiter immédiatement si présente",
    "A — Vérifier la liberté des voies aériennes (LVA) / rechercher une obstruction",
    "B — Apprécier l'efficacité de la respiration",
    "C — Rechercher la présence d'un pouls / signes de circulation",
    "D — Évaluer l'état de conscience"],
  explanation:"Le bilan primaire suit l'ordre XABCD : on traite d'abord ce qui tue le plus vite (hémorragie massive), puis on vérifie successivement voies aériennes, respiration, circulation et conscience." },
{ level:"PSE1", theme:"bilan", difficulty:"moyen", type:"qcm",
  q:"À quoi sert le bilan circonstanciel ?",
  choices:["À évaluer uniquement la douleur de la victime","À comprendre les circonstances de survenue (mécanisme, environnement, dangers) avant d'approcher la victime","À poser un diagnostic médical précis","À remplacer l'appel aux secours"],
  correct:[1],
  explanation:"Le bilan circonstanciel permet d'apprécier la scène : ce qui s'est passé, les dangers persistants, le mécanisme lésionnel, le nombre de victimes — avant même le contact avec la victime." },
{ level:"PSE1", theme:"bilan", difficulty:"facile", type:"qcm",
  q:"L'acronyme SAMPLE, utilisé pour le bilan complémentaire, permet de recueillir notamment :",
  choices:["Le signalement administratif de la victime","Symptômes, Allergies, Médicaments, antécédents (Passé médical), dernier repas (Last meal), Évènement","Le score de Glasgow uniquement","La tension artérielle uniquement"],
  correct:[1],
  explanation:"SAMPLE = Symptômes, Allergies, Médicaments pris habituellement, antécédents médicaux (Passé), heure du dernier repas (Last meal), Évènement à l'origine du problème. Il complète le bilan par des informations utiles à la régulation médicale." },

// ---------- HÉMORRAGIES ----------
{ level:"PSE1", theme:"hemorragies", difficulty:"facile", type:"qcm",
  q:"Face à une hémorragie externe visible et accessible, quel est le geste de premier réflexe ?",
  choices:["Poser un garrot immédiatement","Comprimer directement la plaie avec la main (si possible protégée) ou un tissu propre","Surélever uniquement le membre sans comprimer","Nettoyer la plaie à l'eau avant tout"],
  correct:[1],
  explanation:"La compression manuelle directe est le geste de premier réflexe : rapide, efficace dans la grande majorité des cas, sans matériel spécifique." },
{ level:"PSE1", theme:"hemorragies", difficulty:"moyen", type:"order",
  scenario:"Une personne se coupe profondément l'avant-bras avec un outil de bricolage et saigne abondamment. Ordonnez la conduite à tenir.",
  actions:[
    "Se protéger (gants si disponibles) avant tout contact avec le sang",
    "Comprimer immédiatement et fermement la plaie avec la main",
    "Allonger la victime",
    "Faire alerter les secours par un témoin pendant que vous maintenez la compression",
    "Si besoin de libérer les mains et si la compression est efficace, mettre en place un pansement compressif",
    "Surveiller la victime en continu jusqu'à la prise en charge par les secours"],
  explanation:"On se protège, on comprime immédiatement, on allonge la victime, on fait alerter pendant qu'on maintient la compression, on relaie éventuellement par un pansement compressif, puis on surveille." },
{ level:"PSE1", theme:"hemorragies", difficulty:"difficile", type:"qcm",
  q:"La compression manuelle directe est inefficace sur une hémorragie d'un membre qui met en jeu le pronostic vital immédiat. Que peut envisager le secouriste en dernier recours ?",
  choices:["Continuer à comprimer sans rien changer d'autre","La pose d'un garrot au-dessus de la plaie, en notant l'heure de pose","Surélever le membre uniquement","Appliquer de la glace directement sur la plaie"],
  correct:[1],
  explanation:"Le garrot est un geste de dernier recours quand la compression (manuelle ou pansement compressif) échoue sur une hémorragie de membre menaçant la vie. L'heure de pose doit impérativement être notée et transmise aux secours." },
{ level:"PSE2", theme:"hemorragies", difficulty:"difficile", type:"qcm",
  q:"Chez une victime présentant une hémorragie externe massive avec signes de choc hémorragique (pâleur, sueurs, pouls rapide et filant), quelle est la priorité du secouriste en PSE2 ?",
  choices:["Attendre l'avis médical avant tout geste d'hémostase","Traiter immédiatement l'hémorragie (compression/garrot) puis alerter en urgence et prévenir la régulation du contexte de choc","Donner à boire pour compenser la perte de sang","Se concentrer uniquement sur la prise des constantes avant d'agir"],
  correct:[1],
  explanation:"L'hémorragie qui menace la vie se traite sans délai ; l'alerte et la transmission précise (dont les signes de choc) permettent une régulation médicale adaptée et une évacuation rapide." },

// ---------- OBSTRUCTION DES VOIES AÉRIENNES ----------
{ level:"PSE1", theme:"obstruction", difficulty:"facile", type:"qcm",
  q:"Une personne s'étouffe en mangeant : elle tousse fort et peut encore parler. Que faites-vous ?",
  choices:["Réaliser immédiatement des claques dans le dos","L'encourager à tousser, sans intervenir, en restant auprès d'elle","Faire des compressions abdominales immédiatement","La faire boire pour faire passer l'aliment"],
  correct:[1],
  explanation:"Si la toux est efficace (obstruction partielle), on ne fait rien d'autre qu'encourager la personne à tousser, en restant présent et attentif à une aggravation." },
{ level:"PSE1", theme:"obstruction", difficulty:"moyen", type:"order",
  scenario:"Une victime adulte s'étouffe : elle ne peut plus ni parler, ni tousser, ni respirer (obstruction totale). Ordonnez la conduite à tenir.",
  actions:[
    "Se placer sur le côté et légèrement en arrière de la victime",
    "Donner jusqu'à 5 claques vigoureuses entre les omoplates",
    "Si inefficace, réaliser jusqu'à 5 compressions abdominales (méthode de Heimlich)",
    "Alterner les séries de 5 claques dans le dos et 5 compressions abdominales",
    "Faire alerter les secours si l'obstruction persiste",
    "Si la victime devient inconsciente, l'allonger au sol et débuter une réanimation cardio-pulmonaire"],
  explanation:"On alterne 5 claques dans le dos puis 5 compressions abdominales jusqu'à désobstruction, en faisant alerter dès que possible ; en cas de perte de connaissance, on bascule vers la RCP." },
{ level:"PSE2", theme:"obstruction", difficulty:"difficile", type:"qcm",
  q:"Chez une victime obèse ou une femme enceinte en fin de grossesse victime d'une obstruction totale des voies aériennes, quelle adaptation du geste de compression est recommandée ?",
  choices:["Aucune, le geste est strictement identique dans tous les cas","Réaliser des compressions thoraciques (et non abdominales) en cas d'impossibilité d'entourer l'abdomen","Ne réaliser que des claques dans le dos, sans jamais comprimer","Attendre systématiquement les secours sans intervenir"],
  correct:[1],
  explanation:"Lorsque les compressions abdominales ne sont pas réalisables (grossesse avancée, forte corpulence), on réalise des compressions thoraciques à la place, en alternance avec les claques dans le dos." },

// ---------- MALAISES ----------
{ level:"PSE1", theme:"malaises", difficulty:"facile", type:"qcm",
  q:"Une personne consciente se sent mal, pâle, en sueurs, sans autre signe de gravité immédiat. Quelle attitude générale adopter ?",
  choices:["La laisser seule le temps qu'elle se sente mieux","Rester auprès d'elle, l'interroger, l'installer confortablement et surveiller son état","Lui donner immédiatement à boire et à manger","La faire marcher pour la faire réagir"],
  correct:[1],
  explanation:"Face à un malaise, on ne laisse jamais la victime seule : on l'interroge (questionnement type SAMPLE), on l'installe dans la position où elle se sent le mieux, et on surveille son évolution en continu." },
{ level:"PSE1", theme:"malaises", difficulty:"moyen", type:"qcm",
  q:"Une personne connue comme diabétique présente un malaise avec sueurs, tremblements et confusion, mais reste consciente et capable d'avaler. Que peut-on envisager, en priorité, en attendant les secours ?",
  choices:["Lui donner du sucre ou une boisson sucrée si elle est consciente et peut avaler sans risque de fausse route","La faire pratiquer un exercice physique","Lui donner des médicaments non prescrits","Ne surtout rien faire avant l'arrivée des secours"],
  correct:[0],
  explanation:"Un resucrage rapide (sucre ou boisson sucrée) peut être proposé si la personne est consciente, capable d'avaler et sans trouble de la déglutition, en cas de suspicion d'hypoglycémie — tout en alertant les secours." },
{ level:"PSE2", theme:"malaises", difficulty:"difficile", type:"qcm",
  q:"Une victime présente un malaise avec une douleur thoracique intense, oppressante, irradiant dans le bras gauche. Quelle est l'attitude prioritaire du secouriste ?",
  choices:["Faire marcher la victime pour vérifier si la douleur persiste","Installer la victime au repos strict (position semi-assise si elle la tolère mieux), ne pas la laisser faire d'effort, alerter en urgence et surveiller étroitement","Lui donner de l'aspirine sans avis médical","Attendre 30 minutes pour voir si ça passe avant d'alerter"],
  correct:[1],
  explanation:"Une douleur thoracique évocatrice d'un syndrome coronarien impose repos strict, alerte immédiate et surveillance rapprochée ; l'effort augmente le travail cardiaque et le risque de complication." },

async function rpc(fnName, params) {
  let res;
  try {
    res = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + fnName, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY
      },
      body: JSON.stringify(params || {})
    });
  } catch (e) {
    return { error: "network", message: "Impossible de contacter le serveur. Vérifiez votre connexion internet." };
  }
  if (!res.ok) {
    let detail = "";
    try { detail = (await res.json()).message || ""; } catch (e) {}
    return { error: "server", message: "Erreur serveur (" + res.status + "). " + detail };
  }
  try { return await res.json(); } catch (e) { return {}; }
}

// Hiérarchie cumulative des fonctions : PSC (0) < PSE1 (1) < PSE2 (2). Un compte voit sa propre
// fonction ET toutes celles de rang inférieur (ex : un PSE2 a accès à PSC + PSE1 + PSE2).
// Miroir front-end de public.niveau_rank() côté Supabase et de NIVEAU_RANK côté edge function.
const NIVEAU_RANK = { PSC: 0, PSE1: 1, PSE2: 2 };
function niveauRank(v) { return Object.prototype.hasOwnProperty.call(NIVEAU_RANK, v) ? NIVEAU_RANK[v] : -1; }
function isLevelUnlocked(level) {
  const acc = state.auth.account;
  if (!acc) return false;
  if (isStaff()) return true;
  return niveauRank(level) <= niveauRank(acc.niveau);
}
function visibleFonctions() {
  const acc = state.auth.account;
  if (!acc) return [];
  if (isStaff()) return ["PSE1", "PSE2", "CHEF_EQUIPE", "CONDUITE", "PSC"];
  const list = ["PSC", "PSE1", "PSE2"].filter(f => niveauRank(f) <= niveauRank(acc.niveau));
  if (acc.is_chef_equipe) list.push("CHEF_EQUIPE");
  if (acc.has_conduite_module) list.push("CONDUITE");
  return list;
}
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function themeLabel(id) {
  const t = THEMES.find(t => t.id === id);
  return t ? t.label : id;
}

// pour que l'utilisateur repère immédiatement où travailler en priorité.
// < 10% rouge · 10-49% orange · 50-89% jaune · >= 90% vert.
function progressBarClass(pct) {
  if (pct < 10) return "pc-red";
  if (pct < 50) return "pc-orange";
  if (pct < 90) return "pc-yellow";
  return "pc-green";
}

function filterPool() {
  const s = state.settings;
  return QUESTIONS.filter(q => {
    if (q.level !== s.level) return false;
    if (s.themes !== "all" && !s.themes.includes(q.theme)) return false;
    if (!s.difficulties.includes(q.difficulty)) return false;
    if (s.mode === "situation" && q.type !== "order") return false;
    return true;
  });
}

function recordAnswerRemote(q, isCorrect, mode) {
  return rpc("app_record_attempt", {
    p_token: state.auth.token,

    p_theme: q.theme,

  });

/* ============================================================
   AUTHENTIFICATION
   ============================================================ */
// Bibliothèque de questions (thèmes + questions) : historiquement embarquée en dur dans data_block.js,
// désormais gérée depuis Supabase (onglet Administration > Questionnaires). On mute les tableaux THEMES/
// QUESTIONS en place (au lieu de les réassigner) pour que tous les usages existants (filterPool,
// renderHomeThemePicker, l'assistant, etc.) continuent de fonctionner sans modification.
//
// Filet de sécurité réseau à deux niveaux :
//  1) un cache localStorage (CONTENT_CACHE_KEY), réécrit automatiquement à chaque chargement réussi
//     depuis Supabase (y compris juste après une création/modification/suppression dans l'onglet
//     Pédagogie) — il reste donc toujours à jour avec le contenu réel, sans aucune action manuelle ;
//  2) à défaut (tout premier lancement sur un appareil qui n'a encore jamais réussi à contacter
//     Supabase), le contenu statique embarqué dans data_block.js sert de dernier recours.
function saveContentCache() {
  try {
    localStorage.setItem(CONTENT_CACHE_KEY, JSON.stringify({ themes: THEMES, questions: QUESTIONS }));
  } catch (e) {
    // Cache best-effort : si le stockage local est indisponible ou plein, on continue sans bloquer.
  }
}

function loadContentCacheIfAny() {
  try {
    const raw = localStorage.getItem(CONTENT_CACHE_KEY);
    if (!raw) return;
    const cached = JSON.parse(raw);
    if (cached && Array.isArray(cached.themes) && Array.isArray(cached.questions) && cached.themes.length) {
      THEMES.length = 0; cached.themes.forEach(t => THEMES.push(t));
      QUESTIONS.length = 0; cached.questions.forEach(q => QUESTIONS.push(q));
    }
  } catch (e) {
    // Cache corrompu ou illisible : on garde le contenu statique de data_block.js tel quel.
  }
}

async function loadContentFromServer() {
  try {
    const [tr, qr] = await Promise.all([
      rpc("app_list_themes", { p_token: state.auth.token }),
      rpc("app_list_questions", { p_token: state.auth.token })
    ]);
    if (tr && Array.isArray(tr.themes)) {
      THEMES.length = 0;
      tr.themes.forEach(t => THEMES.push(t));
    }
    if (qr && Array.isArray(qr.questions)) {
      QUESTIONS.length = 0;
      qr.questions.forEach(q => QUESTIONS.push(q));
    }
    saveContentCache();
    render();
  } catch (e) {
    // Réseau/Supabase injoignable : le cache localStorage (le plus récent contenu connu) ou, à défaut,
    // le contenu statique de data_block.js reste affiché (dégradation silencieuse).
  }
}

function onProfilePhotoSelected(file) {
  const f = state.myProfileForm;
  f.error = null;
  if (!file) return;
  const allowed = ["image/png", "image/jpeg", "image/webp", "image/gif"];
  if (!allowed.includes(file.type)) { f.error = "Formats acceptés : PNG, JPEG, WEBP, GIF."; render(); return; }
  if (file.size > 5242880) { f.error = "La photo dépasse la limite de 5 Mo."; render(); return; }
  f.photoFile = file;
  const reader = new FileReader();
  reader.onload = () => { f.photoPreview = reader.result; render(); };
  reader.readAsDataURL(file);
}

async function submitMyProfileForm() {
  const f = state.myProfileForm;
  f.error = null;
  if (!f.full_name || f.full_name.trim().length < 2) { f.error = "Merci d'indiquer un nom complet."; render(); return; }

  f.busy = true; f.uploadProgress = 0; render();

  let photoUrl = f.photo_url;
  let previousPath = null;
  if (f.photoFile) {
    const initRes = await profileFn("init_avatar_upload", {
      file_name: f.photoFile.name, mime_type: f.photoFile.type, file_size: f.photoFile.size
    });
    if (!initRes || initRes.error || !initRes.upload_url) {
      f.busy = false;
      f.error = (initRes && initRes.message) || "Impossible de préparer l'envoi de la photo.";
      render();
      return;
    }
    try {
      await uploadFileToSignedUrl(initRes.upload_url, f.photoFile, (pct) => { f.uploadProgress = pct; render(); });
    } catch (e) {
      f.busy = false;
      f.error = "Échec de l'envoi de la photo. Vérifiez votre connexion et réessayez.";
      render();
      return;
    }
    photoUrl = initRes.public_url;
    previousPath = initRes.previous_path;
  }

  const r = await rpc("app_update_my_profile", {
    p_token: state.auth.token,
    p_full_name: f.full_name.trim(),
    p_date_naissance: f.date_naissance || null,
    p_adresse: f.adresse || null,
    p_photo_url: photoUrl || null
  });
  f.busy = false;
  if (!r || r.error) {
    f.error = "Impossible d'enregistrer le profil pour le moment.";
    render();
    return;
  }

  state.auth.account = r.account;
  // Nettoyage de l'ancienne photo une fois la nouvelle bien enregistrée (jamais avant, pour ne pas
  // perdre l'ancienne si l'étape précédente avait échoué).
  if (previousPath) profileFn("delete_avatar_path", { path: previousPath });

  f.photoFile = null;
  f.photoPreview = null;
  f.photo_url = photoUrl || "";
  f.message = "Profil mis à jour.";
  render();
}

async function changeMergedRole(accountId, value) {
  const opt = MERGED_ROLE_OPTIONS.find(o => o.value === value);
  if (!opt) return;
  const acc = (state.accounts && Array.isArray(state.accounts)) ? state.accounts.find(a => a.id === accountId) : null;
  if (acc && acc.role !== opt.role) {
    const r1 = await rpc("app_admin_set_role", { p_token: state.auth.token, p_target_id: accountId, p_role: opt.role });
    if (!r1 || r1.error) {
      const messages = { cannot_change_self: "Vous ne pouvez pas modifier votre propre rôle.", last_administrateur: "Impossible : il doit rester au moins un administrateur actif." };
      alert((r1 && messages[r1.error]) || "Impossible de modifier ce rôle.");
      goToAdmin();
      return;
    }
  }
  if (opt.role === "secouriste") {
    const r2 = await rpc("app_set_niveau", { p_token: state.auth.token, p_target_id: accountId, p_niveau: opt.niveau });
    if (!r2 || r2.error) { alert("Le rôle a été mis à jour, mais impossible de mettre à jour la fonction (PSC/Secouriste/Équipier-Secouriste)."); }
  }
  goToAdmin();
}

function renderCreateProfileCard() {
  const f = state.createProfileForm;
  const card = el(`<div class="card"></div>`);
  card.appendChild(el(`<p class="help" style="margin-top:0;">Créez directement un compte (secouriste, formateur ou administrateur) sans passer par l'inscription. Communiquez ensuite les identifiants en personne.</p>`));
  if (f.successMsg) card.appendChild(el(`<div class="empty-state" style="color:var(--ok, #1a7f37);">${esc(f.successMsg)}</div>`));
  if (f.error) card.appendChild(el(`<div class="empty-state" style="color:var(--critical);">${esc(f.error)}</div>`));

  const inputStyle = "width:100%;margin-bottom:12px;padding:10px 12px;font-size:14px;border-radius:8px;border:1px solid var(--border);background:var(--surface-1);font-family:inherit;";

  const nameInput = el(`<input type="text" placeholder="Nom complet" style="${inputStyle}" value="${esc(f.fullName)}">`);
  nameInput.oninput = (e) => { f.fullName = e.target.value; };
  card.appendChild(nameInput);

  const emailInput = el(`<input type="email" placeholder="Email" style="${inputStyle}" value="${esc(f.email)}">`);
  emailInput.oninput = (e) => { f.email = e.target.value; };
  card.appendChild(emailInput);

  const pwdInput = el(`<input type="text" placeholder="Mot de passe initial (6 caractères minimum)" style="${inputStyle}" value="${esc(f.password)}">`);
  pwdInput.oninput = (e) => { f.password = e.target.value; };
  card.appendChild(pwdInput);

  card.appendChild(el(`<label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;">Rôle</label>`));
  const roleRow = el(`<div class="choice-row" style="margin-bottom:14px;"></div>`);
  const currentMergedValue = f.role === "secouriste" ? f.niveau : f.role;
  MERGED_ROLE_OPTIONS.forEach(opt => {
    const chip = el(`<div class="chip ${currentMergedValue === opt.value ? "selected" : ""}">${esc(opt.label)}</div>`);
    chip.onclick = () => { f.role = opt.role; if (opt.niveau) f.niveau = opt.niveau; render(); };
    roleRow.appendChild(chip);
  });
  card.appendChild(roleRow);

  const submitBtn = el(`<button class="btn block" ${f.busy ? "disabled" : ""}>${f.busy ? "Création…" : "Créer le profil"}</button>`);
  submitBtn.onclick = submitCreateProfile;
  card.appendChild(submitBtn);

  return card;
}

async function goToQuestionsAdmin() {
  state.view = "questionsAdmin";
  state.questionsAdmin.loading = true;
  state.questionsAdmin.error = false;
  render();
  const [tr, qr] = await Promise.all([
    rpc("app_list_themes", { p_token: state.auth.token }),
    rpc("app_list_questions", { p_token: state.auth.token })
  ]);
  state.questionsAdmin.loading = false;
  if (tr && Array.isArray(tr.themes) && qr && Array.isArray(qr.questions)) {
    THEMES.length = 0; tr.themes.forEach(t => THEMES.push(t));
    QUESTIONS.length = 0; qr.questions.forEach(q => QUESTIONS.push(q));
    saveContentCache();
  } else {
    state.questionsAdmin.error = true;
  }
  render();
}

function slugifyThemeId(label) {
  return String(label || "")
    .toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, "_")
    .replace(/^_+|_+$/g, "")
    .slice(0, 60);
}

function openThemeForm(theme) {
  if (theme) {
    state.themeForm = { open: true, editingId: theme.id, id: theme.id, label: theme.label, level: theme.level, busy: false, error: null };
  } else {
    state.themeForm = { open: true, editingId: null, id: "", label: "", level: "PSE1", busy: false, error: null };
  }
  render();
}
function closeThemeForm() { state.themeForm.open = false; render(); }

async function submitThemeForm() {
  const f = state.themeForm;
  f.error = null;
  const label = f.label.trim();
  if (!label) { f.error = "Le libellé est obligatoire."; render(); return; }
  f.busy = true; render();
  let r;
  if (f.editingId) {
    r = await rpc("app_admin_update_theme", { p_token: state.auth.token, p_id: f.editingId, p_label: label, p_level: f.level });
  } else {
    const id = slugifyThemeId(label);
    if (!id || id.length < 2) { f.busy = false; f.error = "Impossible de générer un identifiant à partir de ce libellé."; render(); return; }
    r = await rpc("app_admin_create_theme", { p_token: state.auth.token, p_id: id, p_label: label, p_level: f.level });
  }
  f.busy = false;
  if (!r || r.error) {
    const messages = { id_taken: "Un thème avec cet identifiant existe déjà.", invalid_label: "Libellé invalide.", invalid_level: "Fonction invalide.", forbidden: "Action réservée au personnel encadrant." };
    f.error = (r && messages[r.error]) || "Impossible d'enregistrer ce thème.";
    render();
    return;
  }
  state.themeForm.open = false;
  goToQuestionsAdmin();
}

async function deleteTheme(theme) {
  const count = QUESTIONS.filter(q => q.theme === theme.id).length;
  if (count > 0) { alert("Impossible de supprimer ce thème : il contient encore " + count + " question(s). Supprimez-les d'abord."); return; }
  if (!confirm("Supprimer le thème « " + theme.label + " » ?")) return;
  const r = await rpc("app_admin_delete_theme", { p_token: state.auth.token, p_id: theme.id });
  if (!r || r.error) { alert("Impossible de supprimer ce thème."); return; }
  if (state.questionsAdmin.selectedTheme === theme.id) state.questionsAdmin.selectedTheme = null;
  goToQuestionsAdmin();
}

function openQuestionForm(themeId, question) {
  if (question) {
    state.questionForm = {
      open: true, editingId: question.id, themeId: question.theme, difficulty: question.difficulty, type: question.type,
      q: question.q || "", scenario: question.scenario || "",
      choices: (question.choices && question.choices.length ? question.choices.slice() : ["", ""]),
      correct: (question.correct || []).slice(),
      actions: (question.actions && question.actions.length ? question.actions.slice() : ["", ""]),
      answers: (question.answers && question.answers.length ? question.answers.slice() : [""]),
      explanation: question.explanation || "", busy: false, error: null
    };
  } else {
    state.questionForm = { open: true, editingId: null, themeId: themeId || (THEMES[0] ? THEMES[0].id : ""), difficulty: "moyen", type: "qcm", q: "", scenario: "", choices: ["", ""], correct: [], actions: ["", ""], answers: [""], explanation: "", busy: false, error: null };
  }
  render();
}
function closeQuestionForm() { state.questionForm.open = false; render(); }

function questionFormAddChoice() { state.questionForm.choices.push(""); render(); }
function questionFormRemoveChoice(i) {
  const f = state.questionForm;
  f.choices.splice(i, 1);
  f.correct = f.correct.filter(c => c !== i).map(c => c > i ? c - 1 : c);
  render();
}
function questionFormToggleCorrect(i) {
  const f = state.questionForm;
  if (f.correct.includes(i)) f.correct = f.correct.filter(c => c !== i);
  else f.correct = f.correct.concat([i]);
  render();
}
function questionFormAddAction() { state.questionForm.actions.push(""); render(); }
function questionFormRemoveAction(i) { state.questionForm.actions.splice(i, 1); render(); }
function questionFormAddAnswer() { state.questionForm.answers.push(""); render(); }
function questionFormRemoveAnswer(i) { state.questionForm.answers.splice(i, 1); render(); }

async function submitQuestionForm() {
  const f = state.questionForm;
  f.error = null;
  if (!f.themeId) { f.error = "Choisissez un thème."; render(); return; }

  const payload = { theme_id: f.themeId, difficulty: f.difficulty, type: f.type, explanation: f.explanation.trim() };
  if (f.type === "qcm" || f.type === "vf") {
    const choices = f.choices.map(c => c.trim()).filter(Boolean);
    if (!f.q.trim() || choices.length < 2 || f.correct.length < 1) { f.error = "Question, au moins 2 choix et au moins 1 bonne réponse sont requis."; render(); return; }
    payload.q = f.q.trim(); payload.choices = choices; payload.correct = f.correct.filter(c => c < choices.length);
  } else if (f.type === "order") {
    const actions = f.actions.map(a => a.trim()).filter(Boolean);
    if (!f.scenario.trim() || actions.length < 2) { f.error = "Situation et au moins 2 étapes (dans le bon ordre) sont requises."; render(); return; }
    payload.scenario = f.scenario.trim(); payload.actions = actions;
  } else if (f.type === "short") {
    const answers = f.answers.map(a => a.trim()).filter(Boolean);
    if (!f.q.trim() || answers.length < 1) { f.error = "Question et au moins une réponse acceptée sont requises."; render(); return; }
    payload.q = f.q.trim(); payload.answers = answers;
  }

  f.busy = true; render();
  let r;
  if (f.editingId) {
    r = await rpc("app_admin_update_question", { p_token: state.auth.token, p_id: f.editingId, p_payload: payload });
  } else {
    r = await rpc("app_admin_create_question", { p_token: state.auth.token, p_payload: payload });
  }
  f.busy = false;
  if (!r || r.error) {
    const messages = { invalid_shape: "Le contenu de la question est incomplet pour ce type.", invalid_theme: "Thème invalide.", forbidden: "Action réservée au personnel encadrant." };
    f.error = (r && messages[r.error]) || "Impossible d'enregistrer cette question.";
    render();
    return;
  }
  state.questionForm.open = false;
  goToQuestionsAdmin();
}

async function deleteQuestion(question) {
  if (!confirm("Supprimer cette question ?")) return;
  const r = await rpc("app_admin_delete_question", { p_token: state.auth.token, p_id: question.id });
  if (!r || r.error) { alert("Impossible de supprimer cette question."); return; }
  goToQuestionsAdmin();
}

/* ============================================================
   MOTEUR DE QUIZ
   ============================================================ */
function normalizeAnswerText(s) {
  return String(s || "")
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9\s]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function beginQuiz() {
  let pool = filterPool();
  if (pool.length === 0) { alert("Aucune question ne correspond à ces filtres. Élargissez votre sélection."); return; }
  pool = shuffle(pool);
  const n = state.settings.count === "toutes" ? pool.length : Math.min(state.settings.count, pool.length);
  const questions = pool.slice(0, n).map(q => {
    const item = Object.assign({}, q);
    if (q.type === "order") {
      const order = shuffle(q.actions.map((a, i) => i));
      item.displayOrder = order;
    } else if (q.type === "short") {
      // pas de displayChoices/displayOrder : réponse libre
    } else {
      item.displayChoices = shuffle(q.choices.map((c, i) => i));
    }
    return item;
  });
  state.quiz = {
    questions,
    index: 0,
    validated: false,
    selected: [],
    currentOrder: null,
    shortAnswer: "",
    results: [],
    mode: state.settings.mode,
    timeLeft: state.settings.mode === "examen" ? questions.length * 45 : null,
    timerId: null
  };
  if (state.quiz.mode === "examen") startTimer();
  setupCurrentQuestion();
  state.view = "quiz";
  render();
}

function startTimer() {
  clearInterval(state.quiz.timerId);
  state.quiz.timerId = setInterval(() => {
    if (!state.quiz) return;
    state.quiz.timeLeft--;
    if (state.quiz.timeLeft <= 0) {
      clearInterval(state.quiz.timerId);
      state.quiz.timeLeft = 0;
      finishQuiz();
      return;
    }
    updateTimerDisplay();
  }, 1000);
}

function updateTimerDisplay() {
  const elx = document.getElementById("timerDisplay");
  if (!elx || !state.quiz) return;
  const t = state.quiz.timeLeft;
  const m = Math.floor(t / 60), s = t % 60;
  elx.textContent = m + ":" + String(s).padStart(2, "0");
  elx.classList.toggle("low", t <= 30);
}

function setupCurrentQuestion() {
  const q = state.quiz.questions[state.quiz.index];
  state.quiz.validated = false;
  state.quiz.shortAnswer = "";
  if (q.type === "order") {
    state.quiz.currentOrder = q.displayOrder.slice();
    state.quiz.selected = [];
  } else {
    state.quiz.currentOrder = null;
    state.quiz.selected = [];
  }
}

function isMultiAnswer(q) { return q.correct.length > 1; }

function selectChoice(originalIdx) {
  const quiz = state.quiz;
  if (quiz.validated) return;
  const q = quiz.questions[quiz.index];
  if (isMultiAnswer(q)) {
    if (quiz.selected.includes(originalIdx)) quiz.selected = quiz.selected.filter(i => i !== originalIdx);
    else quiz.selected = quiz.selected.concat([originalIdx]);
  } else {
    quiz.selected = [originalIdx];
  }
  render();
}

function moveOrderItem(pos, dir) {
  const quiz = state.quiz;
  if (quiz.validated) return;
  const arr = quiz.currentOrder;
  const newPos = pos + dir;
  if (newPos < 0 || newPos >= arr.length) return;
  [arr[pos], arr[newPos]] = [arr[newPos], arr[pos]];
  render();
}

function validateAnswer() {
  const quiz = state.quiz;
  const q = quiz.questions[quiz.index];
  let correct = false;
  if (q.type === "order") {
    correct = quiz.currentOrder.every((originalIdx, pos) => originalIdx === pos);
  } else if (q.type === "short") {
    const given = normalizeAnswerText(quiz.shortAnswer);
    correct = given.length > 0 && (q.answers || []).some(a => normalizeAnswerText(a) === given);
  } else {
    const chosenOriginal = quiz.selected.slice().sort();
    const expected = q.correct.slice().sort();
    correct = chosenOriginal.length === expected.length && chosenOriginal.every((v, i) => v === expected[i]);
  }
  quiz.validated = true;
  quiz.results.push({ q, correct });
  if (quiz.mode !== "examen") recordAnswerRemote(q, correct, quiz.mode);
  render();
}

function nextQuestion() {
  const quiz = state.quiz;
  if (quiz.index < quiz.questions.length - 1) {
    quiz.index++;
    setupCurrentQuestion();
    render();
  } else {
    finishQuiz();
  }
}

function finishQuiz() {
  const quiz = state.quiz;
  if (quiz.timerId) clearInterval(quiz.timerId);
  if (quiz.mode === "examen") {
    quiz.results.forEach(r => recordAnswerRemote(r.q, r.correct, quiz.mode));
  }
  state.view = "result";
  render();
}

function restartSameSettings() { beginQuiz(); }

   ASSETS DE MARQUE — logo réel MyPSE (recadré depuis la charte

function svgIcon(name, size) {
  const s = size || 20;
  const body = ICON_PATHS[name] || ICON_PATHS.star;
  return `<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
}
// Logo MyPSE : livre ouvert stylisé, croix médicale rouge en haut, tracé ECG traversant l'ouverture du
// livre (cf. charte graphique MyPSE fournie le 20/08/2026). Rendu en couleurs fixes (pas "currentColor")
// pour que la croix reste toujours rouge et le tracé toujours blanc, quel que soit le fond utilisé.
function svgLogoMark(size) {
  const s = size || 22;
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M3.5 6.2h6.1A2.3 2.3 0 0 1 11.9 8.5v10.6a2 2 0 0 0-2.1-1.3H3.5z" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M5.8 13.1h3l1-2 1.5 4.1 1.1-2.6.9.5h3.6" stroke="#fff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <rect x="9.4" y="1.4" width="5.2" height="5.2" rx="1.5" fill="#E63946"/>
    <path d="M12 2.6v2.8M10.6 4h2.8" stroke="#fff" stroke-width="1.1" stroke-linecap="round"/>
  </svg>`;
}
function iconChip(name, opts) {
  opts = opts || {};
  const size = opts.size === "sm" ? "sm" : opts.size === "lg" ? "lg" : "";
  const color = opts.color || "";
  return `<div class="icon-chip ${size} ${color}">${svgIcon(name, opts.iconSize || (size === "lg" ? 24 : size === "sm" ? 16 : 19))}</div>`;
}

// Ex-"barre de confiance" MyPSE (Fiable / À jour / Accessible / Indispensable / Engagé), retirée le
// 29/08/2026 à la demande du porteur de projet ("ne sert pas à grand-chose") et remplacée sur l'accueil
// par les événements à venir et les modules en cours (widgets déjà existants, simplement remontés en
// haut de page — voir renderLearnerHomeContent). Fonction et constante supprimées, plus utilisées.

function render() {
  const root = document.getElementById("app-root");
  root.innerHTML = "";

  if (state.view === "loading") {
    root.appendChild(el(`<div class="empty-state" style="padding-top:80px;">Chargement…</div>`));
    return;
  }
  if (state.view === "auth") {
    root.appendChild(renderAuthScreen());
    return;
  }

  const shell = el(`<div class="shell"></div>`);
  shell.appendChild(renderSidebar());
  if (state.mobileSidebarOpen) {
    const backdrop = el(`<div style="position:fixed;inset:0;background:rgba(6,10,20,0.5);z-index:35;"></div>`);
    backdrop.onclick = () => { state.mobileSidebarOpen = false; render(); };
    shell.appendChild(backdrop);
  }
  const content = el(`<div class="content"></div>`);
  content.appendChild(renderTopbar());
  const appDiv = el(`<div class="app"></div>`);
  if (state.view !== "quiz") appDiv.appendChild(renderDisclaimer());
  if (state.view === "home") appDiv.appendChild(renderHome());
  else if (state.view === "setup") appDiv.appendChild(renderWizard());
  else if (state.view === "quiz") appDiv.appendChild(renderQuiz());
  else if (state.view === "result") appDiv.appendChild(renderResult());
  else if (state.view === "progress") appDiv.appendChild(renderProgress());
  else if (state.view === "questionnaires") appDiv.appendChild(renderQuestionnaires());
  else if (state.view === "myProfile") appDiv.appendChild(renderMyProfile());
  else if (state.view === "personnelManagement") appDiv.appendChild(renderPersonnelManagement());
  else if (state.view === "formateur") appDiv.appendChild(renderFormateur());
  else if (state.view === "documents") appDiv.appendChild(renderDocuments());
  else if (state.view === "admin") appDiv.appendChild(renderAdmin());
  else if (state.view === "createProfile") appDiv.appendChild(renderCreateProfilePage());
  else if (state.view === "questionsAdmin") appDiv.appendChild(renderQuestionsAdmin());
  else if (state.view === "myTraining") appDiv.appendChild(renderMyTraining());
  else if (state.view === "learnerTraining") appDiv.appendChild(renderLearnerTraining());
  else if (state.view === "trainingOverview") appDiv.appendChild(renderTrainingOverview());
  else if (state.view === "myFma") appDiv.appendChild(renderMyFma());
  else if (state.view === "fmaOverview") appDiv.appendChild(renderFmaOverview());
  else if (state.view === "learnerParcours") appDiv.appendChild(renderLearnerParcours());
  else if (state.view === "sessions") appDiv.appendChild(renderSessions());
  appDiv.appendChild(renderFooter());
  content.appendChild(appDiv);
  shell.appendChild(content);
  root.appendChild(shell);

  if (state.view === "quiz" && state.quiz.mode === "examen") updateTimerDisplay();
}

function renderTopbar() {
  const bar = el(`<div class="topbar"><div class="brand-mini"><img class="brand-logo-img" src="${BRAND_LOGO_DARK}" alt="MyPSE" /></div><button class="burger">☰</button></div>`);
  bar.querySelector(".burger").onclick = () => { state.mobileSidebarOpen = !state.mobileSidebarOpen; render(); };
  return bar;
}

function renderSidebar() {
  const aside = el(`<aside class="sidebar ${state.mobileSidebarOpen ? "open" : ""}">
    <div class="brand">
      <div class="mark"><img class="brand-logo-img" src="${BRAND_LOGO_ICON}" alt="MyPSE" /></div>
      <div>
        <div class="name">MyPSE</div>
        <div class="sub">Le carnet numérique du secouriste</div>
      </div>
    </div>
    <nav class="side-nav" id="navMain"></nav>
    <div class="nav-group-label">Mes formations</div>
    <nav class="side-nav" id="navTrack"></nav>
    <div class="nav-group-label">Questionnaires</div>
    <nav class="side-nav" id="navQuiz"></nav>
    <div class="nav-group-label">Ressources</div>
    <nav class="side-nav" id="navRes"></nav>
    ${isFormateur() ? '<div class="nav-group-label">Pédagogie</div><nav class="side-nav" id="navPedago"></nav>' : ""}
    ${isAdministrateur() ? '<div class="nav-group-label">Administration</div><nav class="side-nav" id="navAdmin"></nav>' : ""}
    <div class="spacer"></div>
    <div class="ref-badge">${esc(state.appSettings.referentiel_banner)}</div>
    <div class="account-box" id="accountBox"></div>
  </aside>`);

  const navMain = aside.querySelector("#navMain");
  const homeBtn = el(`<button class="${state.view === "home" ? "active" : ""}"><span class="ic">${svgIcon("home", 15)}</span>Accueil</button>`);
  homeBtn.onclick = () => { goToHome(); closeMobileSidebar(); render(); };
  navMain.appendChild(homeBtn);

  // "Formation initiale" détachée du groupe "Mes formations" le 29/08/2026, à la demande du porteur de
  // projet : c'est un carnet de suivi de scolarité (validation point par point par le formateur), pas
  // une révision par thème/fonction — placée ici en onglet à part entière juste sous "Accueil".
  // Position définitive dans le menu à revoir plus tard (non tranchée par le porteur de projet).
  const trainActive = ["myTraining", "trainingOverview"].includes(state.view);
  const trainBtn = el(`<button class="${trainActive ? "active" : ""}"><span class="ic">${svgIcon("cap", 15)}</span>Formation initiale</button>`);

const HOME_LEVEL_ORDER = ["PSC", "PSE1", "PSE2"];
const HOME_LEVEL_META = {
  PSC: { badge: "Niveau 0", css: "psc", icon: "cross", sub: "Premiers Secours Citoyen (PSC)" },
  PSE1: { badge: "Niveau 1", css: "pse1", icon: "book", sub: "Premiers Secours en Équipe niveau 1 (PSE1)" },
  PSE2: { badge: "Niveau 2", css: "pse2", icon: "layers", sub: "Premiers Secours en Équipe niveau 2 (PSE2)" }
};

// Choisit automatiquement le thème le plus pertinent pour "Lancer ma révision recommandée" :
// priorité aux thématiques jamais travaillées (parmi les fonctions accessibles au compte), puis, si
// tout a déjà été essayé au moins une fois, au thème le moins maîtrisé (taux de réussite le plus bas).
// Reprend la même logique que le widget "Modules en cours" déjà en place.
function pickRecommendedTheme() {
  const levels = visibleFonctions().filter(id => HOME_LEVEL_ORDER.includes(id));
  const candidateThemes = THEMES.filter(t => levels.includes(t.level));
  if (candidateThemes.length === 0) return null;

  const byTheme = (state.myProgress && state.myProgress.by_theme) || [];
  const statsByTheme = {};
  byTheme.forEach(t => { statsByTheme[t.theme] = t; });

  const neverTried = candidateThemes.filter(t => !statsByTheme[t.id] || !statsByTheme[t.id].total);
  if (neverTried.length > 0) {
    return neverTried[Math.floor(Math.random() * neverTried.length)];
  }

  const ranked = candidateThemes
    .map(t => Object.assign({}, t, { pct: statsByTheme[t.id].correct / statsByTheme[t.id].total }))
    .sort((a, b) => a.pct - b.pct);
  return ranked[0];
}

function goToRecommendedRevision() {
  const t = pickRecommendedTheme();
  if (!t) return;
  quickStartTheme(t.level, t.id);
}

// Tableau de bord de pilotage pour formateur/administrateur : statistiques globales sur les
// secouristes suivis + raccourcis vers les pages de gestion. Remplace la vue "révision" (qui reste
// l'accueil des secouristes) car un formateur ne s'entraîne pas lui-même depuis cet écran.
function renderFormateurHomeContent() {
  const container = el(`<div></div>`);
  const firstName = (state.auth.account.full_name || "").split(" ")[0];
  container.appendChild(el(`<div class="page-header">${iconChip("home", {color: ""})}<div><div class="page-title">Bonjour ${esc(firstName)}</div><div class="page-sub">Vue d'ensemble de vos secouristes et accès rapide aux outils de suivi.</div></div></div>`));

  if (state.secouristes === "loading") {
    container.appendChild(el(`<div class="card"><div class="empty-state">Chargement…</div></div>`));
    return container;
  }
  if (!state.secouristes || state.secouristes.error) {
    const c = el(`<div class="card"><div class="empty-state">Impossible de charger les données pour le moment.</div></div>`);
    const retry = el(`<button class="btn block">Réessayer</button>`);
    retry.onclick = goToHome;
    c.appendChild(retry);
    container.appendChild(c);
    return container;
  }

  const list = state.secouristes;
  const totalAttempts = list.reduce((s, x) => s + x.total, 0);
  const totalCorrect = list.reduce((s, x) => s + x.correct, 0);
  const overallPct = totalAttempts ? Math.round(totalCorrect / totalAttempts * 100) : 0;
  const activeCount = list.filter(x => x.total > 0).length;

  container.appendChild(el(`<div class="card">
    <h3 style="margin:0 0 10px 0;">Vos secouristes</h3>
    <div class="stat-grid">
      <div class="stat-tile"><div class="val">${list.length}</div><div class="lbl">Comptes secouristes</div></div>
      <div class="stat-tile"><div class="val">${activeCount}</div><div class="lbl">Ayant déjà pratiqué</div></div>
      <div class="stat-tile"><div class="val">${overallPct}%</div><div class="lbl">Taux de réussite moyen</div></div>
    </div>
  </div>`));

  const shortcuts = [
    { icon: "users", color: "indigo", title: "Personnels", sub: "Suivi individuel et difficulté recommandée", fn: goToFormateur },
    { icon: "cap", color: "coral", title: "Formation initiale", sub: "Vue d'ensemble module par module", fn: goToTrainingOverview },
    { icon: "calendar", color: "teal", title: "Recyclage (FMA)", sub: "Suivi de la formation continue", fn: goToFmaOverview },
    { icon: "clipboard", color: "amber", title: "Questionnaires", sub: "Statistiques et contenus de révision", fn: goToProgress },
    { icon: "folder", color: "good", title: "Documents", sub: "Mémos, fiches et vidéos", fn: goToDocuments },
    { icon: "calendar", color: "indigo", title: "Calendrier", sub: "Séances et entraînements programmés", fn: goToSessions }
  ];
  if (isAdministrateur()) {
    shortcuts.push({ icon: "users", color: "critical", title: "Administration", sub: "Comptes, rôles et réglages", fn: goToAdmin });
  }

  const grid = el(`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:16px;"></div>`);
  shortcuts.forEach(s => {
    const card = el(`<div class="card" style="cursor:pointer;display:flex;gap:12px;align-items:flex-start;">
      ${iconChip(s.icon, { color: s.color })}
      <div><div style="font-weight:700;font-size:14.5px;">${esc(s.title)}</div><div style="font-size:12.5px;color:var(--text-muted);margin-top:2px;">${esc(s.sub)}</div></div>
    </div>`);
    card.onclick = s.fn;
    grid.appendChild(card);
