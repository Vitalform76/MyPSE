  const saveBtn = el(`<button class="btn" ${f.busy ? "disabled" : ""}>${f.busy ? "Enregistrement…" : "Enregistrer"}</button>`);
  saveBtn.onclick = submitThemeForm;
  btnRow.appendChild(saveBtn);
  const cancelBtn = el(`<button class="btn secondary">Annuler</button>`);
  cancelBtn.onclick = closeThemeForm;
  btnRow.appendChild(cancelBtn);
  wrap.appendChild(btnRow);

  return wrap;
}

function renderQuestionForm() {
  const f = state.questionForm;
  const wrap = el(`<div class="card" style="margin:10px 0;background:var(--surface-1);"></div>`);
  wrap.appendChild(el(`<h3 style="margin-top:0;">${f.editingId ? "Modifier la question" : "Nouvelle question"}</h3>`));
  if (f.error) wrap.appendChild(el(`<div class="empty-state" style="color:var(--critical);">${esc(f.error)}</div>`));
  const inputStyle = "width:100%;margin-bottom:12px;padding:10px 12px;font-size:14px;border-radius:8px;border:1px solid var(--border);background:var(--surface-1);font-family:inherit;";
  const smallInputStyle = "flex:1;padding:8px 10px;font-size:13.5px;border-radius:7px;border:1px solid var(--border);background:var(--surface-1);font-family:inherit;";

  wrap.appendChild(el(`<label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;">Thème</label>`));
  const themeSelect = el(`<select style="${inputStyle}"></select>`);
  THEMES.forEach(t => themeSelect.appendChild(el(`<option value="${esc(t.id)}">${esc(t.label)} (${esc(niveauShortLabel(t.level))})</option>`)));
  themeSelect.value = f.themeId;
  themeSelect.onchange = (e) => { f.themeId = e.target.value; };
  wrap.appendChild(themeSelect);

  wrap.appendChild(el(`<label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;">Difficulté</label>`));
  const diffRow = el(`<div class="choice-row" style="margin-bottom:12px;"></div>`);
  [["facile", "Facile"], ["moyen", "Moyen"], ["difficile", "Difficile"]].forEach(([did, label]) => {
    const chip = el(`<div class="chip ${f.difficulty === did ? "selected" : ""}">${label}</div>`);
    chip.onclick = () => { f.difficulty = did; render(); };
    diffRow.appendChild(chip);
  });
  wrap.appendChild(diffRow);

  wrap.appendChild(el(`<label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;">Type de question</label>`));
  const typeRow = el(`<div class="choice-row" style="margin-bottom:14px;"></div>`);
  [["qcm", "QCM"], ["vf", "Vrai / Faux"], ["short", "Réponse courte"], ["order", "Mise en situation (ordre)"]].forEach(([tid, label]) => {
    const chip = el(`<div class="chip ${f.type === tid ? "selected" : ""}">${label}</div>`);
    chip.onclick = () => {
      f.type = tid;
      if (tid === "vf") f.choices = ["Vrai", "Faux"];
      else if (tid === "qcm" && f.choices.length < 2) f.choices = ["", ""];
      render();
    };
    typeRow.appendChild(chip);
  });
  wrap.appendChild(typeRow);

  if (f.type === "qcm" || f.type === "vf") {
    const qInput = el(`<textarea placeholder="Intitulé de la question" rows="2" style="${inputStyle}resize:vertical;">${esc(f.q)}</textarea>`);
    qInput.oninput = (e) => { f.q = e.target.value; };
    wrap.appendChild(qInput);

    wrap.appendChild(el(`<label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;">Choix (cochez la/les bonne(s) réponse(s))</label>`));
    f.choices.forEach((c, i) => {
      const choiceRow = el(`<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;"></div>`);
      const checkbox = el(`<input type="checkbox" ${f.correct.includes(i) ? "checked" : ""} style="flex:none;width:18px;height:18px;">`);
      checkbox.onchange = () => questionFormToggleCorrect(i);
      choiceRow.appendChild(checkbox);
      const choiceInput = el(`<input type="text" placeholder="Choix ${i + 1}" style="${smallInputStyle}" value="${esc(c)}" ${f.type === "vf" ? "disabled" : ""}>`);
      choiceInput.oninput = (e) => { f.choices[i] = e.target.value; };
      choiceRow.appendChild(choiceInput);
      if (f.type === "qcm" && f.choices.length > 2) {
        const rmBtn = el(`<button class="btn secondary" style="padding:4px 10px;font-size:12px;">✕</button>`);
        rmBtn.onclick = () => questionFormRemoveChoice(i);
        choiceRow.appendChild(rmBtn);
      }
      wrap.appendChild(choiceRow);
    });
    if (f.type === "qcm") {
      const addChoiceBtn = el(`<button class="btn secondary" style="margin-bottom:12px;">+ Ajouter un choix</button>`);
      addChoiceBtn.onclick = questionFormAddChoice;
      wrap.appendChild(addChoiceBtn);
    }
  } else if (f.type === "order") {
    const scenarioInput = el(`<textarea placeholder="Mise en situation" rows="2" style="${inputStyle}resize:vertical;">${esc(f.scenario)}</textarea>`);
    scenarioInput.oninput = (e) => { f.scenario = e.target.value; };
    wrap.appendChild(scenarioInput);

    wrap.appendChild(el(`<label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;">Étapes, dans le bon ordre</label>`));
    f.actions.forEach((a, i) => {
      const actionRow = el(`<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;"></div>`);
      actionRow.appendChild(el(`<span style="flex:none;font-weight:700;font-size:12.5px;color:var(--text-muted);">${i + 1}.</span>`));
      const actionInput = el(`<input type="text" placeholder="Étape ${i + 1}" style="${smallInputStyle}" value="${esc(a)}">`);
      actionInput.oninput = (e) => { f.actions[i] = e.target.value; };
      actionRow.appendChild(actionInput);
      if (f.actions.length > 2) {
        const rmBtn = el(`<button class="btn secondary" style="padding:4px 10px;font-size:12px;">✕</button>`);
        rmBtn.onclick = () => questionFormRemoveAction(i);
        actionRow.appendChild(rmBtn);
      }
      wrap.appendChild(actionRow);
    });
    const addActionBtn = el(`<button class="btn secondary" style="margin-bottom:12px;">+ Ajouter une étape</button>`);
    addActionBtn.onclick = questionFormAddAction;
    wrap.appendChild(addActionBtn);
  } else if (f.type === "short") {
    const qInput = el(`<textarea placeholder="Intitulé de la question" rows="2" style="${inputStyle}resize:vertical;">${esc(f.q)}</textarea>`);
    qInput.oninput = (e) => { f.q = e.target.value; };
    wrap.appendChild(qInput);

    wrap.appendChild(el(`<label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;">Réponses acceptées (insensible aux accents/majuscules)</label>`));
    f.answers.forEach((a, i) => {
      const ansRow = el(`<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;"></div>`);
      const ansInput = el(`<input type="text" placeholder="Réponse acceptée ${i + 1}" style="${smallInputStyle}" value="${esc(a)}">`);
      ansInput.oninput = (e) => { f.answers[i] = e.target.value; };
      ansRow.appendChild(ansInput);
      if (f.answers.length > 1) {
        const rmBtn = el(`<button class="btn secondary" style="padding:4px 10px;font-size:12px;">✕</button>`);
        rmBtn.onclick = () => questionFormRemoveAnswer(i);
        ansRow.appendChild(rmBtn);
      }
      wrap.appendChild(ansRow);
    });
    const addAnswerBtn = el(`<button class="btn secondary" style="margin-bottom:12px;">+ Ajouter une réponse acceptée</button>`);
    addAnswerBtn.onclick = questionFormAddAnswer;
    wrap.appendChild(addAnswerBtn);
  }

  wrap.appendChild(el(`<label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;">Explication (affichée après la réponse)</label>`));
  const explInput = el(`<textarea placeholder="Explication pédagogique" rows="2" style="${inputStyle}resize:vertical;">${esc(f.explanation)}</textarea>`);
  explInput.oninput = (e) => { f.explanation = e.target.value; };
  wrap.appendChild(explInput);

  const btnRow = el(`<div style="display:flex;gap:8px;"></div>`);
  const saveBtn = el(`<button class="btn" ${f.busy ? "disabled" : ""}>${f.busy ? "Enregistrement…" : "Enregistrer"}</button>`);
  saveBtn.onclick = submitQuestionForm;
  btnRow.appendChild(saveBtn);
  const cancelBtn = el(`<button class="btn secondary">Annuler</button>`);
  cancelBtn.onclick = closeQuestionForm;
  btnRow.appendChild(cancelBtn);
  wrap.appendChild(btnRow);

  return wrap;
}

/* ============================================================
   CALENDRIER — rendu
   ============================================================ */
// Ajoutée le 29/08/2026 pour "Gestion du personnel" : formate une date simple (YYYY-MM-DD, ex. date de
// naissance) en jj/mm/aaaa. Distincte de formatSessionDate ci-dessus, qui inclut l'heure.
function formatDateFR(isoDate) {
  if (!isoDate) return "";
  const parts = String(isoDate).split("-");
  if (parts.length !== 3) return isoDate;
  return parts[2] + "/" + parts[1] + "/" + parts[0];
}

function formatSessionDate(iso) {
  const d = new Date(iso);
  const dateStr = d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const timeStr = d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  return dateStr.charAt(0).toUpperCase() + dateStr.slice(1) + " à " + timeStr;
}

// Ajouté le 20/08/2026 (soir) : convertit une date ISO (venant de Supabase) vers le format attendu par
// un input HTML <input type="datetime-local">, en heure locale — nécessaire pour pré-remplir le
// formulaire d'entraînement en mode édition (point 15 de la liste du porteur de projet).
function toDatetimeLocalValue(iso) {
  const d = new Date(iso);
  const pad = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
}

function toggleSessionQuizDifficulty(id) {
  const f = state.sessionForm;
  if (f.quizDifficulties.includes(id)) {
    if (f.quizDifficulties.length > 1) f.quizDifficulties = f.quizDifficulties.filter(d => d !== id);
  } else {
    f.quizDifficulties = f.quizDifficulties.concat([id]);
  }
  render();
}
function setSessionQuizMode(mode) { state.sessionForm.quizMode = mode; render(); }
function setSessionQuizCount(n) { state.sessionForm.quizCount = n; render(); }

function renderSessions() {
  const container = el(`<div></div>`);
  container.appendChild(el(`<div class="page-header">${iconChip("calendar", {color: "teal"})}<div><div class="page-title">Calendrier des entraînements</div><div class="page-sub">Prochaines séances, thématiques et quiz associés.</div></div></div>`));

  if (isFormateur()) container.appendChild(renderSessionFormToggleCard());

  if (state.sessions === "loading") {
    container.appendChild(el(`<div class="card"><div class="empty-state">Chargement des entraînements…</div></div>`));
    return container;
  }
  if (!state.sessions || state.sessions.error) {
    const c = el(`<div class="card"><div class="empty-state">Impossible de charger le calendrier pour le moment.</div></div>`);
    const retry = el(`<button class="btn block">Réessayer</button>`);
    retry.onclick = goToSessions;
    c.appendChild(retry);
    container.appendChild(c);
    return container;
  }

  const visible = visibleFonctions();
  const now = Date.now();
  const upcoming = state.sessions
    .filter(s => visible.includes(s.fonction) && new Date(s.starts_at).getTime() >= now - 3600000)
    .sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));

  if (upcoming.length === 0) {
    container.appendChild(el(`<div class="card"><div class="empty-state">Aucun entraînement prévu pour le moment.</div></div>`));
    return container;
  }

  upcoming.forEach(s => container.appendChild(renderSessionCard(s)));
  return container;
}

function renderSessionCard(s) {
  const card = el(`<div class="card" style="margin-bottom:12px;"></div>`);
  card.appendChild(el(`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">
    <div>
      <div style="font-weight:700;font-size:15px;">${esc(s.title)}</div>
      <div style="font-size:12.5px;color:var(--text-muted);margin-top:2px;">${esc(formatSessionDate(s.starts_at))}</div>
    </div>
    <span class="tag tag-blue">${esc(fonctionLabel(s.fonction))}</span>
  </div>`));

  if (s.theme) {
    const label = (s.fonction === "PSE1" || s.fonction === "PSE2") ? themeLabel(s.theme) : s.theme;
    card.appendChild(el(`<div style="margin-top:8px;"><span class="tag">${esc(label)}</span></div>`));
  }

  if (s.description) card.appendChild(el(`<p style="margin-top:10px;font-size:13.5px;color:var(--text-secondary);">${esc(s.description)}</p>`));

  const actions = el(`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;"></div>`);
  if (s.quiz_config) {
    const quizBtn = el(`<button class="btn">Faire le quizz de cette séance</button>`);
    quizBtn.onclick = () => startSessionQuiz(s);
    actions.appendChild(quizBtn);
  }
  if (isFormateur()) {
    const editBtn = el(`<button class="btn secondary">Modifier</button>`);
    editBtn.onclick = () => openEditSessionForm(s);
    actions.appendChild(editBtn);
    const delBtn = el(`<button class="btn secondary" style="color:var(--critical);">Supprimer</button>`);
    delBtn.onclick = () => deleteSession(s);
    actions.appendChild(delBtn);
  }
  if (actions.children.length) card.appendChild(actions);

  if (state.documents && Array.isArray(state.documents)) {
    const linked = state.documents.filter(d => d.fonction === s.fonction && (s.theme ? d.theme === s.theme : !d.theme));
    if (linked.length) {
      const docsWrap = el(`<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);"></div>`);
      docsWrap.appendChild(el(`<div style="font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:6px;">Documents liés</div>`));
      linked.forEach(d => {
        const link = el(`<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;font-size:13px;">
          <span>${esc(d.title)}</span>
        </div>`);
        const openBtn = el(`<button class="btn secondary" style="padding:4px 10px;font-size:12px;">${d.kind === "link" ? "Ouvrir" : "Télécharger"}</button>`);
        openBtn.onclick = () => openDocument(d);
        link.appendChild(openBtn);
        docsWrap.appendChild(link);
      });
      card.appendChild(docsWrap);
    }
  }

  return card;
}

function renderSessionFormToggleCard() {
  const wrap = el(`<div></div>`);
  const toggleBtn = el(`<button class="btn" style="margin-bottom:16px;">${state.sessionForm.open ? "Fermer" : "+ Ajouter un entraînement"}</button>`);
  // Ajouté le 20/08/2026 (soir) : fermer le formulaire réinitialise aussi l'édition en cours (editingId),
  // pour ne pas laisser le formulaire "collé" sur une séance en cas de ré-ouverture ultérieure.
  toggleBtn.onclick = () => {
    if (state.sessionForm.open) { resetSessionForm(); } else { state.sessionForm.open = true; }
    render();
  };
  wrap.appendChild(toggleBtn);
  if (state.sessionForm.open) wrap.appendChild(renderSessionForm());
  return wrap;
}

function renderSessionForm() {
  const f = state.sessionForm;
  const card = el(`<div class="card"></div>`);
  card.appendChild(el(`<h3>${f.editingId ? "Modifier l'entraînement" : "Nouvel entraînement"}</h3>`));
  const inputStyle = "width:100%;margin-bottom:12px;padding:10px 12px;font-size:14px;border-radius:8px;border:1px solid var(--border);background:var(--surface-1);font-family:inherit;";

  const titleInput = el(`<input type="text" placeholder="Titre de la séance" style="${inputStyle}" value="${esc(f.title)}">`);
  titleInput.oninput = (e) => { f.title = e.target.value; };
  card.appendChild(titleInput);

  card.appendChild(el(`<label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;">Date et heure</label>`));
  const dateInput = el(`<input type="datetime-local" style="${inputStyle}" value="${esc(f.startsAt)}">`);
  dateInput.oninput = (e) => { f.startsAt = e.target.value; };
  card.appendChild(dateInput);

  card.appendChild(el(`<label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;">Module concerné</label>`));
  const fonctionRow = el(`<div class="choice-row" style="margin-bottom:12px;"></div>`);
  FONCTIONS.forEach(fo => {
    const chip = el(`<div class="chip ${f.fonction === fo.id ? "selected" : ""}">${esc(fo.label)}</div>`);
    chip.onclick = () => { f.fonction = fo.id; f.theme = ""; render(); };
    fonctionRow.appendChild(chip);
  });
  card.appendChild(fonctionRow);

  if (f.fonction === "PSE1" || f.fonction === "PSE2") {
    card.appendChild(el(`<label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;">Thématique abordée</label>`));
    const themeSelect = el(`<select style="${inputStyle}"></select>`);
    themeSelect.appendChild(el(`<option value="">Générale (pas de thème précis)</option>`));
    THEMES.filter(t => t.level === f.fonction).forEach(t => {
      themeSelect.appendChild(el(`<option value="${esc(t.id)}">${esc(t.label)}</option>`));
    });
    themeSelect.value = f.theme || "";
    themeSelect.onchange = (e) => { f.theme = e.target.value; render(); };
    card.appendChild(themeSelect);
  } else {
    const themeInput = el(`<input type="text" placeholder="Thématique (optionnel)" style="${inputStyle}" value="${esc(f.theme)}">`);
    themeInput.oninput = (e) => { f.theme = e.target.value; };
    card.appendChild(themeInput);
  }

  const descInput = el(`<textarea placeholder="Description (optionnel)" rows="2" style="${inputStyle}resize:vertical;">${esc(f.description)}</textarea>`);
  descInput.oninput = (e) => { f.description = e.target.value; };
  card.appendChild(descInput);

  if (f.fonction === "PSE1" || f.fonction === "PSE2") {
    card.appendChild(el(`<div style="border-top:1px solid var(--border);margin:6px 0 14px;padding-top:14px;">
      <div style="font-weight:700;font-size:13.5px;margin-bottom:8px;">Quizz spécial de la séance (optionnel)</div>
      <p class="help" style="margin:-2px 0 10px;">Si configuré, les secouristes concernés pourront lancer ce quizz en un clic depuis le calendrier. La thématique ci-dessus sera utilisée comme filtre.</p>
    </div>`));

    card.appendChild(el(`<label class="field-label">Difficulté</label>`));
    const diffRow = el(`<div class="choice-row" style="margin-bottom:10px;"></div>`);
    [["facile", "Facile"], ["moyen", "Moyen"], ["difficile", "Difficile"]].forEach(([id, label]) => {
      const chip = el(`<div class="chip ${f.quizDifficulties.includes(id) ? "selected" : ""}">${label}</div>`);
      chip.onclick = () => toggleSessionQuizDifficulty(id);
      diffRow.appendChild(chip);
    });
    card.appendChild(diffRow);

    card.appendChild(el(`<label class="field-label">Mode</label>`));
    const modeRow = el(`<div class="choice-row" style="margin-bottom:10px;"></div>`);
    [["entrainement", "Entraînement libre"], ["situation", "Mise en situation"], ["examen", "Examen chronométré"]].forEach(([id, label]) => {
      const chip = el(`<div class="chip ${f.quizMode === id ? "selected" : ""}">${label}</div>`);
      chip.onclick = () => setSessionQuizMode(id);
      modeRow.appendChild(chip);
    });
    card.appendChild(modeRow);

    card.appendChild(el(`<label class="field-label">Nombre de questions</label>`));
    const countRow = el(`<div class="choice-row" style="margin-bottom:4px;"></div>`);
    [10, 15, 20, "toutes"].forEach(n => {
      const chip = el(`<div class="chip ${f.quizCount === n ? "selected" : ""}">${n === "toutes" ? "Toutes" : n}</div>`);
      chip.onclick = () => setSessionQuizCount(n);
      countRow.appendChild(chip);
    });
    card.appendChild(countRow);
  }

  if (f.error) card.appendChild(el(`<p class="help" style="color:var(--critical);margin:12px 0;">${esc(f.error)}</p>`));

  const submitLabel = f.busy
    ? (f.editingId ? "Enregistrement…" : "Création…")
    : (f.editingId ? "Enregistrer les modifications" : "Créer l'entraînement");
  const submitBtn = el(`<button class="btn block" style="margin-top:14px;" ${f.busy ? "disabled" : ""}>${submitLabel}</button>`);
  submitBtn.onclick = submitSessionForm;
  card.appendChild(submitBtn);

  return card;
}
