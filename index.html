function renderLearnerHomeContent() {
  const container = el(`<div></div>`);
  const firstName = (state.auth.account.full_name || "").split(" ")[0];
  container.appendChild(el(`<div class="page-header">${iconChip("home", {color: ""})}<div><div class="page-title">Bonjour ${firstName}</div><div class="page-sub">Choisissez une fonction pour découvrir ses thématiques et commencer une séance de révision.</div></div></div>`));

  // 29/08/2026 : remonté ici à la place de l'ex-barre de confiance — le porteur de projet voulait voir
  // ses événements à venir et ses modules en cours directement en haut de l'accueil, pour toutes les
  // fonctions (les deux widgets ci-dessous s'adaptent déjà automatiquement aux fonctions visibles du
  // compte connecté). Widgets inchangés, seulement déplacés (ils étaient plus bas sur la page).
  const levelsForTopWidgets = visibleFonctions().filter(id => HOME_LEVEL_ORDER.includes(id));
  const topWidgetRow = el(`<div style="display:flex;gap:16px;flex-wrap:wrap;margin:16px 0 20px;align-items:flex-start;"></div>`);
  topWidgetRow.appendChild(renderHomeCalendarWidget());
  topWidgetRow.appendChild(renderHomeInProgressWidget(levelsForTopWidgets));
  container.appendChild(topWidgetRow);

  const recommended = pickRecommendedTheme();
  if (recommended) {
    const recoRow = el(`<div style="margin:14px 0 18px;"></div>`);
    const recoBtn = el(`<button class="btn primary" style="font-weight:700;">🎯 Lancer ma révision recommandée</button>`);
    recoBtn.onclick = goToRecommendedRevision;
    recoRow.appendChild(recoBtn);
    recoRow.appendChild(el(`<div class="help" style="margin-top:6px;">On choisit pour vous : une thématique jamais travaillée, ou sinon celle où votre score est le plus faible.</div>`));
    container.appendChild(recoRow);
  }

  // Toujours les 3 blocs (PSC, Secouriste, Équipier Secouriste). Les fonctions au-dessus du niveau du
  // compte sont affichées verrouillées (cadenas) ; cliquer sur un bloc déverrouillé déplie la liste de
  // ses thématiques juste en dessous (même logique que "Questionnaires non commencés").
  const grid = el(`<div class="level-grid"></div>`);
  HOME_LEVEL_ORDER.forEach(id => {
    const meta = HOME_LEVEL_META[id];
    const unlocked = isLevelUnlocked(id);
    const expanded = state.homeExpandedLevel === id;
    const card = el(`<div class="level-card ${meta.css} ${unlocked ? "" : "locked"} ${expanded ? "expanded" : ""}">
      <div class="lc-icon">${svgIcon(unlocked ? meta.icon : "lock", 18)}</div>
      <div class="lc-badge">${unlocked ? esc(meta.badge) : "🔒 Verrouillé"}</div>
      <div class="lc-title">${esc(niveauShortLabel(id))}</div>
      <div class="lc-sub">${unlocked ? esc(meta.sub) : "Débloqué automatiquement dès que votre fonction est mise à jour par votre formateur."}</div>
    </div>`);
    if (unlocked) {
      card.onclick = () => { state.homeExpandedLevel = expanded ? null : id; render(); };
    }
    grid.appendChild(card);
  });
  container.appendChild(grid);

  if (!isFormateur()) {
    container.appendChild(el(`<p class="help" style="margin-top:14px;">Votre fonction (${esc(niveauShortLabel(state.auth.account.niveau))}) est définie par votre formateur : elle donne accès à son propre contenu ainsi qu'à celui des fonctions inférieures. Contactez votre formateur si vous pensez qu'elle doit être mise à jour.</p>`));
  }

  if (state.homeExpandedLevel) {
    container.appendChild(renderHomeThemePicker(state.homeExpandedLevel));
  }

  if (!isFormateur()) {
    container.appendChild(renderHomeParcoursCard());
  }

  return container;
}

// Dépliage d'un bloc de fonction : liste ses thématiques ("propose les différentes thématiques"),
// cliquables pour démarrer directement un entraînement de 15 questions, ou un bouton pour ouvrir
// l'assistant complet (choix fin des thèmes/difficulté/mode). Remplace l'ancienne liste à plat
// "Questionnaires non commencés" par le même système de blocs que la sélection de fonction.
function renderHomeThemePicker(level) {
  const card = el(`<div class="card" style="margin-top:16px;"></div>`);
  const header = el(`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"></div>`);
  header.appendChild(el(`<h3 style="margin:0;">${esc(niveauShortLabel(level))} — choisissez une thématique</h3>`));
  const closeBtn = el(`<a style="font-size:12.5px;font-weight:700;color:var(--blue);cursor:pointer;">Fermer</a>`);
  closeBtn.onclick = () => { state.homeExpandedLevel = null; render(); };
  header.appendChild(closeBtn);
  card.appendChild(header);

  const themesForLevel = THEMES.filter(t => t.level === level);
  if (themesForLevel.length === 0) {
    card.appendChild(el(`<div class="empty-state">Contenu en cours de préparation pour cette fonction. Revenez bientôt !</div>`));
    return card;
  }

  const attempted = new Set(((state.myProgress && state.myProgress.by_theme) || []).filter(t => t.total > 0).map(t => t.theme));
  const row = el(`<div class="choice-row"></div>`);
  themesForLevel.forEach(t => {
    const chip = el(`<div class="chip" style="cursor:pointer;">${esc(t.label)}${attempted.has(t.id) ? "" : " · nouveau"}</div>`);
    chip.onclick = () => quickStartTheme(t.level, t.id);
    row.appendChild(chip);
  });
  card.appendChild(row);
  card.appendChild(el(`<p class="help" style="margin-top:10px;">Cliquez sur une thématique pour démarrer directement un entraînement de 15 questions.</p>`));

  const fullBtn = el(`<button class="btn secondary" style="margin-top:10px;">Configurer une séance complète (thèmes, difficulté, mode…)</button>`);
  fullBtn.onclick = () => goToLevelWizard(level);
  card.appendChild(fullBtn);

  return card;
}

function renderHomeCalendarWidget() {
  const card = el(`<div class="card accent-teal" style="flex:1 1 320px;"></div>`);
  const header = el(`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;"></div>`);
  const titleRow = el(`<div style="display:flex;align-items:center;gap:9px;"></div>`);
  titleRow.appendChild(el(iconChip("calendar", { size: "sm", color: "teal" })));
  titleRow.appendChild(el(`<h3 style="margin:0;">Prochains entraînements</h3>`));
  header.appendChild(titleRow);
  const seeAll = el(`<a style="font-size:12.5px;font-weight:700;color:var(--blue);cursor:pointer;">Voir tout</a>`);
  seeAll.onclick = goToSessions;
  header.appendChild(seeAll);
  card.appendChild(header);

  if (state.sessions === "loading") {
    card.appendChild(el(`<div class="empty-state">Chargement…</div>`));
    return card;
  }
  if (!state.sessions || state.sessions.error) {
    card.appendChild(el(`<div class="empty-state">Calendrier indisponible pour le moment.</div>`));
    return card;
  }

  const visible = visibleFonctions();
  const now = Date.now();
  const upcoming = state.sessions
    .filter(s => visible.includes(s.fonction) && new Date(s.starts_at).getTime() >= now - 3600000)
    .sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at))
    .slice(0, 3);

  if (upcoming.length === 0) {
    card.appendChild(el(`<div class="empty-state">Aucun entraînement prévu pour le moment.</div>`));
    return card;
  }
  upcoming.forEach((s, i) => {
    const row = el(`<div style="padding:10px 0;${i > 0 ? "border-top:1px solid var(--border);" : ""}cursor:pointer;">
      <div style="font-weight:700;font-size:13.5px;">${esc(s.title)}</div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">${esc(formatSessionDate(s.starts_at))} · ${esc(fonctionLabel(s.fonction))}</div>
    </div>`);
    row.onclick = goToSessions;
    card.appendChild(row);
  });
  return card;
}

function renderHomeInProgressWidget(levels) {
  const card = el(`<div class="card accent-indigo" style="flex:1 1 320px;"></div>`);
  const titleRow = el(`<div style="display:flex;align-items:center;gap:9px;margin-bottom:6px;"></div>`);
  titleRow.appendChild(el(iconChip("chart", { size: "sm", color: "indigo" })));
  titleRow.appendChild(el(`<h3 style="margin:0;">Modules en cours</h3>`));
  card.appendChild(titleRow);

  if (state.myProgress === "loading") {
    card.appendChild(el(`<div class="empty-state">Chargement…</div>`));
    return card;
  }
  if (!state.myProgress || state.myProgress.error) {
    card.appendChild(el(`<div class="empty-state">Progression indisponible pour le moment.</div>`));
    return card;
  }

  const byTheme = state.myProgress.by_theme || [];
  const inProgress = byTheme
    .filter(t => t.total > 0 && levels.includes(themeLevel(t.theme)))
    .map(t => Object.assign({}, t, { pct: Math.round(t.correct / t.total * 100) }))
    .sort((a, b) => a.pct - b.pct)
    .slice(0, 4);

  if (inProgress.length === 0) {
    card.appendChild(el(`<div class="empty-state">Vous n'avez pas encore commencé de thème. Lancez un entraînement pour voir votre progression ici.</div>`));
    return card;
  }
  inProgress.forEach(t => {
    const row = el(`<div class="theme-row" style="cursor:pointer;">
      <span class="name">${esc(themeLabel(t.theme))}</span>
      <span class="bar-outer"><span class="bar-inner ${progressBarClass(t.pct)}" style="width:${t.pct}%"></span></span>
      <span class="pct">${t.pct}%</span>
    </div>`);
    row.onclick = () => quickStartTheme(themeLevel(t.theme), t.theme);
    card.appendChild(row);
  });
  card.appendChild(el(`<p class="help" style="margin-top:10px;">Cliquez sur un thème pour continuer à vous entraîner dessus.</p>`));
  return card;
}

/* ============================================================
   QUESTIONNAIRES (nouvelle section, 29/08/2026)
   Page dédiée avec un onglet par fonction (PSC / Secouriste / Équipier Secouriste / Conduite),
   même verrouillage visuel (cadenas) que le reste de l'application. Chaque onglet liste les
   thématiques de la fonction avec leur barre de maîtrise colorée, cliquables pour réviser.
   ============================================================ */
const QUESTIONNAIRES_TABS_META = {
  PSC: { label: "Premiers Secours Citoyen", icon: "cross" },
  PSE1: { label: "Secouriste", icon: "book" },
  PSE2: { label: "Équipier Secouriste", icon: "layers" },
  CONDUITE: { label: "Conduite", icon: "star" }
};
function renderQuestionnaires() {
  const container = el(`<div></div>`);
  const tab = state.questionnairesTab || "PSC";
  const meta = QUESTIONNAIRES_TABS_META[tab] || QUESTIONNAIRES_TABS_META.PSC;
  container.appendChild(el(`<div class="page-header">${iconChip(meta.icon, { color: "" })}<div><div class="page-title">Questionnaires</div><div class="page-sub">Parcourez les thématiques par fonction avant de lancer une révision.</div></div></div>`));

  // Barre d'onglets : PSC / Secouriste / Équipier Secouriste / Conduite, avec cadenas pour les
  // fonctions non accessibles au compte connecté (même logique que la barre latérale).
  const tabBar = el(`<div class="qtab-bar"></div>`);
  Object.keys(QUESTIONNAIRES_TABS_META).forEach(id => {
    const m = QUESTIONNAIRES_TABS_META[id];
    const ok = id === "CONDUITE" ? visibleFonctions().includes("CONDUITE") : isLevelUnlocked(id);
    const isActive = tab === id;
    const btn = el(`<button class="qtab ${isActive ? "active" : ""} ${ok ? "" : "locked"}" ${ok ? "" : "disabled"}>${svgIcon(ok ? m.icon : "lock", 15)}${esc(m.label)}${ok ? "" : " 🔒"}</button>`);
    if (ok) btn.onclick = () => goToQuestionnaires(id);
    tabBar.appendChild(btn);
  });
  container.appendChild(tabBar);

  const okCurrent = tab === "CONDUITE" ? visibleFonctions().includes("CONDUITE") : isLevelUnlocked(tab);
  if (!okCurrent) {
    container.appendChild(el(`<div class="card" style="margin-top:16px;"><div class="empty-state">🔒 Cette fonction n'est pas encore accessible à votre niveau actuel. Contactez votre formateur si vous pensez qu'elle doit être mise à jour.</div></div>`));
    return container;
  }

  const themesForTab = THEMES.filter(t => t.level === tab);
  const card = el(`<div class="card" style="margin-top:16px;"></div>`);
  if (themesForTab.length === 0) {
    card.appendChild(el(`<div class="empty-state">Contenu de révision en cours de préparation pour cette fonction. En attendant, consultez la rubrique Documents pour les ressources déjà disponibles.</div>`));
    container.appendChild(card);
    return container;
  }

  if (state.myProgress === "loading") {
    card.appendChild(el(`<div class="empty-state">Chargement…</div>`));
    container.appendChild(card);
    return container;
  }

  const statsByTheme = {};
  ((state.myProgress && state.myProgress.by_theme) || []).forEach(t => { statsByTheme[t.theme] = t; });
  themesForTab.forEach(t => {
    const s = statsByTheme[t.id];
    const pct = s && s.total ? Math.round(s.correct / s.total * 100) : 0;
    const row = el(`<div class="theme-row" style="cursor:pointer;">
      <span class="name">${esc(t.label)}${!s || !s.total ? " · nouveau" : ""}</span>
      <span class="bar-outer"><span class="bar-inner ${progressBarClass(pct)}" style="width:${pct}%"></span></span>
      <span class="pct">${pct}%</span>
    </div>`);
    row.onclick = () => quickStartTheme(tab, t.id);
    card.appendChild(row);
  });
  container.appendChild(card);

  const fullBtn = el(`<button class="btn secondary" style="margin-top:14px;">Configurer une séance complète (thèmes, difficulté, mode…)</button>`);
  fullBtn.onclick = () => goToLevelWizard(tab);
  container.appendChild(fullBtn);

  return container;
}

/* ============================================================
   ASSISTANT (WIZARD) DE PARAMÈTRES DE SÉANCE
   ============================================================ */
function renderWizard() {
  const s = state.settings;
  const container = el(`<div></div>`);
  const subtitles = { PSE1: "Premiers Secours en Équipe niveau 1 (PSE1)", PSE2: "Premiers Secours en Équipe niveau 2 (PSE2)", PSC: "Premiers Secours Citoyen (PSC)" };
  const wizLevelMeta = HOME_LEVEL_META[s.level] || { icon: "book" };
  const wizColor = s.level === "PSC" ? "teal" : s.level === "PSE2" ? "indigo" : "";
  container.appendChild(el(`<div class="page-header">${iconChip(wizLevelMeta.icon, {color: `${wizColor}`})}<div><div class="page-title">${esc(niveauShortLabel(s.level))}</div><div class="page-sub">${esc(subtitles[s.level] || "")}</div></div></div>`));

  if (s.level === "PSC" && THEMES.filter(t => t.level === "PSC").length === 0) {
    container.appendChild(el(`<div class="card"><div class="empty-state">Le contenu d'entraînement PSC (Premiers Secours Citoyen) est en cours de préparation et sera ajouté prochainement. En attendant, consultez la rubrique Documents pour les ressources déjà disponibles.</div></div>`));
    const btn = el(`<button class="btn block" style="margin-top:4px;">Retour à l'accueil</button>`);
    btn.onclick = goToHome;
    container.appendChild(btn);
    return container;
  }

  const card = el(`<div class="card"></div>`);
  const stepper = el(`<div class="stepper"></div>`);
  WIZARD_STEPS.forEach((st, i) => {
    if (i > 0) stepper.appendChild(el(`<div class="step-line"></div>`));
    const cls = i === state.wizard.step ? "current" : (i < state.wizard.step ? "done" : "");
    const dot = el(`<div class="step-dot ${cls}"><span class="n">${i < state.wizard.step ? "✓" : (i + 1)}</span><span class="lbl">${st.label}</span></div>`);
    if (i <= state.wizard.maxStepSeen) dot.onclick = () => wizardGoTo(i);
    stepper.appendChild(dot);
  });
  card.appendChild(stepper);

  const body = el(`<div></div>`);
  renderWizardStepBody(body, WIZARD_STEPS[state.wizard.step].id);
  card.appendChild(body);

  const nav = el(`<div class="actions-row" style="margin-top:20px;justify-content:space-between;"></div>`);
  const backBtn = el(`<button class="btn secondary" ${state.wizard.step === 0 ? "disabled" : ""}>Précédent</button>`);
  backBtn.onclick = wizardBack;
  nav.appendChild(backBtn);
  if (state.wizard.step < WIZARD_STEPS.length - 1) {
    const nextBtn = el(`<button class="btn">Suivant</button>`);
    nextBtn.onclick = wizardNext;
    nav.appendChild(nextBtn);
  } else {
    const pool = filterPool();
    const startBtn = el(`<button class="btn" ${pool.length === 0 ? "disabled" : ""}>Commencer (${pool.length} question${pool.length > 1 ? "s" : ""})</button>`);
    startBtn.onclick = beginQuiz;
    nav.appendChild(startBtn);
  }
  card.appendChild(nav);
  container.appendChild(card);
  return container;
}

function renderWizardStepBody(container, stepId) {
  const s = state.settings;

  if (stepId === "themes") {
    container.appendChild(el(`<label class="field-label">Choisissez un ou plusieurs thèmes</label>`));
    const grid = el(`<div class="theme-grid" style="margin-top:8px;"></div>`);
    const allChip = el(`<div class="chip ${s.themes === "all" ? "selected" : ""}">Tous les thèmes</div>`);
    allChip.onclick = selectAllThemes;
    grid.appendChild(allChip);
    THEMES.filter(t => t.level === s.level).forEach(t => {
      const active = s.themes !== "all" && s.themes.includes(t.id);
      const chip = el(`<div class="chip ${active ? "selected" : ""}">${t.label}</div>`);
      chip.onclick = () => toggleTheme(t.id);
      grid.appendChild(chip);
    });
    container.appendChild(grid);
    container.appendChild(el(`<p class="help" style="margin-top:10px;">Aucune sélection = tous les thèmes.</p>`));

  } else if (stepId === "difficulty") {
    // Correction du 20/08/2026 (soir) : la sélection de la difficulté n'est plus jamais verrouillée
    // (tous les rôles peuvent choisir librement un ou plusieurs niveaux) — voir applyAccountDefaults().
    container.appendChild(el(`<label class="field-label">Niveau de difficulté</label>`));
    const row = el(`<div class="choice-row"></div>`);
    [["facile", "Facile"], ["moyen", "Moyen"], ["difficile", "Difficile"]].forEach(([id, label]) => {
      const chip = el(`<div class="chip ${s.difficulties.includes(id) ? "selected" : ""}">${label}</div>`);
      chip.onclick = () => toggleDifficulty(id);
      row.appendChild(chip);
    });
    container.appendChild(row);
    const recommended = !isFormateur() && state.auth.account && state.auth.account.difficulty;
    const help = recommended
      ? "Niveau recommandé par votre formateur : " + recommended + ". Vous pouvez librement choisir un ou plusieurs autres niveaux."
      : "Choisissez librement un ou plusieurs niveaux de difficulté.";
    container.appendChild(el(`<p class="help" style="margin-top:10px;">${help}</p>`));

  } else if (stepId === "mode") {
    container.appendChild(el(`<label class="field-label">Mode de séance</label>`));
    const modes = [
      ["entrainement", "Entraînement libre", "QCM et mises en situation mélangés, avec correction immédiate après chaque question."],
      ["situation", "Mise en situation", "Uniquement des scénarios à remettre en ordre, avec correction immédiate."],
      ["examen", "Examen chronométré", "QCM et mises en situation mélangés, temps limité, corrections affichées à la fin."]
    ];
    const row = el(`<div class="choice-row"></div>`);
    modes.forEach(([id, label]) => {
      const chip = el(`<div class="chip ${s.mode === id ? "selected" : ""}">${label}</div>`);
      chip.onclick = () => setMode(id);
      row.appendChild(chip);
    });
    container.appendChild(row);
    container.appendChild(el(`<p class="help" style="margin-top:10px;">${modes.find(m => m[0] === s.mode)[2]}</p>`));

  } else if (stepId === "count") {
    container.appendChild(el(`<label class="field-label">Nombre de questions</label>`));
    const row = el(`<div class="choice-row"></div>`);
    [10, 15, 20, "toutes"].forEach(n => {
      const chip = el(`<div class="chip ${s.count === n ? "selected" : ""}">${n === "toutes" ? "Toutes" : n}</div>`);
      chip.onclick = () => setCount(n);
      row.appendChild(chip);
    });
    container.appendChild(row);

  } else if (stepId === "review") {
    const pool = filterPool();
    const themesLabelTxt = s.themes === "all" ? "Tous les thèmes" : s.themes.map(themeLabel).join(", ");
    const modeLabelTxt = { entrainement: "Entraînement libre", situation: "Mise en situation", examen: "Examen chronométré" }[s.mode];
    const rows = [
      ["Fonction", niveauShortLabel(s.level) + " (" + s.level + ")"],
      ["Thèmes", themesLabelTxt],
      ["Difficulté", s.difficulties.map(x => x[0].toUpperCase() + x.slice(1)).join(", ")],
      ["Mode", modeLabelTxt],
      ["Nombre de questions", s.count === "toutes" ? "Toutes (" + pool.length + ")" : String(s.count)]
    ];
    const table = el(`<div></div>`);
    rows.forEach(([k, v]) => {
      table.appendChild(el(`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--gridline);font-size:13.5px;"><span style="color:var(--text-secondary);font-weight:600;">${k}</span><span style="font-weight:700;">${v}</span></div>`));
    });
    container.appendChild(table);
    container.appendChild(el(`<p class="help" style="margin-top:12px;">${pool.length} question(s) disponible(s) avec ces réglages.</p>`));
  }
}

/* ============================================================
   QUIZ / RÉSULTATS
   ============================================================ */
function renderQuiz() {
  const quiz = state.quiz;
  const q = quiz.questions[quiz.index];
  const container = el(`<div></div>`);
  const card = el(`<div class="card"></div>`);

  const meta = el(`<div class="quiz-meta">
    <div class="tagset">
      <span class="tag tag-blue">${q.level}</span>
      <span class="tag">${themeLabel(q.theme)}</span>
      <span class="tag">${q.difficulty}</span>
    </div>
    <div>${quiz.mode === "examen" ? '<span class="timer" id="timerDisplay"></span>' : ("Question " + (quiz.index + 1) + "/" + quiz.questions.length)}</div>
  </div>`);
  card.appendChild(meta);

  if (quiz.mode === "examen") {
    card.appendChild(el(`<p class="help" style="margin:-4px 0 10px;">Question ${quiz.index + 1}/${quiz.questions.length}</p>`));
  }

  card.appendChild(el(`<div class="progressbar-outer"><div class="progressbar-inner" style="width:${(quiz.index / quiz.questions.length * 100)}%"></div></div>`));

  if (q.type === "order") {
    card.appendChild(el(`<div class="scenario-box"><strong>Situation :</strong> ${q.scenario}</div>`));
    card.appendChild(el(`<p class="qtext" style="font-size:14px;font-weight:600;color:var(--text-secondary);">Remettez les actions dans le bon ordre (utilisez les flèches) :</p>`));
    const ol = el(`<ol class="order-list"></ol>`);
    quiz.currentOrder.forEach((originalIdx, pos) => {
      const li = el(`<li>
        <span class="rank">${pos + 1}</span>
        <span class="txt">${q.actions[originalIdx]}</span>
        <span class="moves">
          <button data-dir="-1" ${pos === 0 ? "disabled" : ""}>▲</button>
          <button data-dir="1" ${pos === quiz.currentOrder.length - 1 ? "disabled" : ""}>▼</button>
        </span>
      </li>`);
      if (quiz.validated) {
        li.classList.add(originalIdx === pos ? "correct" : "incorrect-pos");
        li.querySelectorAll("button").forEach(b => b.disabled = true);
      } else {
        li.querySelectorAll("button").forEach(b => b.onclick = () => moveOrderItem(pos, parseInt(b.dataset.dir)));
      }
      ol.appendChild(li);
    });
    card.appendChild(ol);
  } else if (q.type === "short") {
    card.appendChild(el(`<p class="qtext">${q.q}</p>`));
    const input = el(`<input type="text" class="text-input" placeholder="Votre réponse…" style="width:100%;font-size:15px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);" value="${esc(quiz.shortAnswer || "")}">`);
    if (quiz.validated) {
      input.disabled = true;
      const result = quiz.results[quiz.results.length - 1];
      input.classList.add(result.correct ? "correct" : "incorrect");
    } else {
      input.oninput = (e) => { quiz.shortAnswer = e.target.value; };
    }
    card.appendChild(input);
    if (quiz.validated) {
      card.appendChild(el(`<p class="help" style="margin-top:8px;">Réponse(s) acceptée(s) : ${(q.answers || []).join(", ")}</p>`));
    }
  } else {
    card.appendChild(el(`<p class="qtext">${q.q}</p>`));
    if (isMultiAnswer(q)) card.appendChild(el(`<p class="help" style="margin-top:-10px;margin-bottom:14px;">Plusieurs réponses possibles.</p>`));
    const ul = el(`<ul class="options"></ul>`);
    q.displayChoices.forEach(originalIdx => {
      const li = el(`<li><span class="box"></span><span>${q.choices[originalIdx]}</span></li>`);
      const isSelected = quiz.selected.includes(originalIdx);
      if (quiz.validated) {
        const isCorrectChoice = q.correct.includes(originalIdx);
        if (isCorrectChoice) li.classList.add("correct");
        else if (isSelected) li.classList.add("incorrect");
      } else {
        if (isSelected) li.classList.add("selected");
        li.onclick = () => selectChoice(originalIdx);
      }
      ul.appendChild(li);
    });
    card.appendChild(ul);
  }

  if (quiz.validated && quiz.mode !== "examen") {
    const result = quiz.results[quiz.results.length - 1];
    card.appendChild(el(`<div class="feedback ${result.correct ? "ok" : "ko"}">
      <div class="fb-title">${result.correct ? "✅ Bonne réponse" : "❌ Réponse incorrecte"}</div>
      <div>${q.explanation}</div>
    </div>`));
  }

  const actionsRow = el(`<div class="actions-row"></div>`);
  if (!quiz.validated) {
    const canValidate = q.type === "order" || q.type === "short" || quiz.selected.length > 0;
    const btn = el(`<button class="btn" ${canValidate ? "" : "disabled"}>Valider</button>`);
    btn.onclick = validateAnswer;
    actionsRow.appendChild(btn);
  } else {
    const btn = el(`<button class="btn">${quiz.index < quiz.questions.length - 1 ? "Question suivante" : "Voir les résultats"}</button>`);
    btn.onclick = nextQuestion;
    actionsRow.appendChild(btn);
  }
  card.appendChild(actionsRow);

  container.appendChild(card);
  return container;
}

function renderResult() {
  const quiz = state.quiz;
  const total = quiz.results.length;
  const correct = quiz.results.filter(r => r.correct).length;
  const pct = total ? Math.round(correct / total * 100) : 0;
  const container = el(`<div></div>`);

  container.appendChild(el(`<div class="card">
    <h2>Résultats de la séance</h2>
    <div class="stat-grid">
      <div class="stat-tile"><div class="val">${correct}/${total}</div><div class="lbl">Bonnes réponses</div></div>
      <div class="stat-tile"><div class="val">${pct}%</div><div class="lbl">Score</div></div>
    </div>
  </div>`));

  if (quiz.mode === "examen") {
    const card2 = el(`<div class="card"><h2>Corrections</h2></div>`);
    quiz.questions.forEach((q, i) => {
      const r = quiz.results[i];
      const block = el(`<div style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--gridline);"></div>`);
      block.appendChild(el(`<div class="tagset" style="margin-bottom:6px;"><span class="tag">${themeLabel(q.theme)}</span><span class="tag">${r.correct ? "✅" : "❌"}</span></div>`));
      block.appendChild(el(`<div style="font-weight:600;font-size:14px;margin-bottom:6px;">${q.type === "order" ? q.scenario : q.q}</div>`));
      block.appendChild(el(`<div style="font-size:13px;color:var(--text-secondary);">${q.explanation}</div>`));
      card2.appendChild(block);
    });
    container.appendChild(card2);
  }

  const actions = el(`<div class="actions-row"></div>`);
  const btn1 = el(`<button class="btn secondary">Recommencer avec les mêmes réglages</button>`);
  btn1.onclick = restartSameSettings;
  const btn2 = el(`<button class="btn">Nouveaux réglages</button>`);
  btn2.onclick = goToSetup;
  actions.appendChild(btn1); actions.appendChild(btn2);
  container.appendChild(actions);

  return container;
}

/* ============================================================
   PROGRESSION
   ============================================================ */
function renderProgress() {
  const container = el(`<div></div>`);
  container.appendChild(el(`<div class="page-header">${iconChip("chart", {color: "teal"})}<div><div class="page-title">Ma progression</div><div class="page-sub">Votre historique, tous modules confondus.</div></div></div>`));

  if (state.myProgress === "loading") {
    container.appendChild(el(`<div class="card"><div class="empty-state">Chargement de votre progression…</div></div>`));
    return container;
  }
  if (!state.myProgress || state.myProgress.error) {
    const c = el(`<div class="card"><div class="empty-state">Impossible de charger votre progression pour le moment.</div></div>`);
    const retry = el(`<button class="btn block">Réessayer</button>`);
    retry.onclick = goToProgress;
    c.appendChild(retry);
    container.appendChild(c);
    return container;
  }

  const ov = state.myProgress.overall || { total: 0, correct: 0 };
  const pct = ov.total ? Math.round(ov.correct / ov.total * 100) : 0;

  container.appendChild(el(`<div class="card">
    <div class="stat-grid">
      <div class="stat-tile"><div class="val">${ov.total}</div><div class="lbl">Questions répondues</div></div>
      <div class="stat-tile"><div class="val">${pct}%</div><div class="lbl">Taux de réussite global</div></div>
    </div>
  </div>`));

  const byTheme = state.myProgress.by_theme || [];
  const card2 = el(`<div class="card"><h3>Détail par thème</h3></div>`);
  if (byTheme.length === 0) {
    card2.appendChild(el(`<div class="empty-state">Aucune question répondue pour l'instant. Lancez une séance d'entraînement pour voir apparaître vos statistiques ici.</div>`));
  } else {
    byTheme.slice().sort((a, b) => themeLabel(a.theme).localeCompare(themeLabel(b.theme))).forEach(st => {
      const p = Math.round(st.correct / st.total * 100);
      card2.appendChild(el(`<div class="theme-row">
        <span class="name">${themeLabel(st.theme)}</span>
        <span class="bar-outer"><span class="bar-inner ${progressBarClass(p)}" style="width:${p}%"></span></span>
        <span class="pct">${p}%</span>
      </div>`));
    });
  }
  container.appendChild(card2);

  const btn = el(`<button class="btn block" style="margin-top:4px;">Lancer une nouvelle séance</button>`);
  btn.onclick = goToHome;
  container.appendChild(btn);

  return container;
}

function renderFormateur() {
  const container = el(`<div></div>`);
  container.appendChild(el(`<div class="page-header">${iconChip("users", {color: "indigo"})}<div><div class="page-title">Personnels</div><div class="page-sub">Suivi de progression et difficulté recommandée.</div></div></div>`));

  container.appendChild(el(`<div class="card">
    <h3>Code formateur</h3>
    <p class="help">Communiquez ce code à un collègue pour qu'il crée lui aussi un compte formateur (à saisir lors de son inscription, champ « Je suis formateur »). Modifiable depuis Administration.</p>

  </div>`));

  if (state.secouristes === "loading") {
    container.appendChild(el(`<div class="card"><div class="empty-state">Chargement de la liste des secouristes…</div></div>`));

  }
  if (!state.secouristes || state.secouristes.error) {
    const c = el(`<div class="card"><div class="empty-state">Impossible de charger la liste pour le moment.</div></div>`);

          <div style="font-weight:700;font-size:14.5px;">${sr.full_name}</div>

        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <label style="font-size:12px;color:var(--text-secondary);font-weight:600;">Rôle</label>
          <select id="niveauSelect-${sr.id}" style="font-size:13px;padding:5px 8px;border-radius:7px;border:1px solid var(--border);">
            <option value="PSC" ${sr.niveau === "PSC" ? "selected" : ""}>Premiers Secours Citoyen</option>
            <option value="PSE1" ${sr.niveau === "PSE1" ? "selected" : ""}>Secouriste</option>
            <option value="PSE2" ${sr.niveau === "PSE2" ? "selected" : ""}>Équipier-Secouriste</option>
          </select>
          <label style="font-size:12px;color:var(--text-secondary);font-weight:600;">Difficulté recommandée</label>
          <select id="diffSelect-${sr.id}" style="font-size:13px;padding:5px 8px;border-radius:7px;border:1px solid var(--border);">
            <option value="facile" ${sr.difficulty === "facile" ? "selected" : ""}>Facile</option>
            <option value="moyen" ${sr.difficulty === "moyen" ? "selected" : ""}>Moyen</option>
            <option value="difficile" ${sr.difficulty === "difficile" ? "selected" : ""}>Difficile</option>
          </select>
        </div>
      </div>
      <div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;">
        <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--text-secondary);cursor:pointer;">
          <input type="checkbox" id="chefCk-${sr.id}" ${sr.is_chef_equipe ? "checked" : ""}> Chef d'équipe
        </label>
        <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--text-secondary);cursor:pointer;">
          <input type="checkbox" id="conduiteCk-${sr.id}" ${sr.has_conduite_module ? "checked" : ""}> Module conduite (permis &gt; 3 ans)

      </div>
      <div class="stat-grid" style="margin-top:12px;">
        <div class="stat-tile"><div class="val">${sr.total}</div><div class="lbl">Questions répondues</div></div>
        <div class="stat-tile"><div class="val">${pct === null ? "—" : pct + "%"}</div><div class="lbl">Taux de réussite</div></div>
      </div>
      ${sr.by_theme && sr.by_theme.length ? '<div style="margin-top:12px;" id="themes-' + sr.id + '"></div>' : ""}
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
        <button class="btn secondary" id="trainBtn-${sr.id}">Suivi de formation initiale</button>
        <button class="btn secondary" id="parcoursBtn-${sr.id}">Mon parcours</button>
      </div>
    </div>`);
    card.querySelector("#trainBtn-" + sr.id).onclick = () => goToLearnerTraining(sr.id);
    card.querySelector("#parcoursBtn-" + sr.id).onclick = () => goToLearnerParcours(sr.id);
    card.querySelector("#niveauSelect-" + sr.id).onchange = (e) => changeNiveau(sr.id, e.target.value);
    card.querySelector("#diffSelect-" + sr.id).onchange = (e) => changeDifficulty(sr.id, e.target.value);
    card.querySelector("#chefCk-" + sr.id).onchange = (e) => toggleChefEquipe(sr.id, e.target.checked);
    card.querySelector("#conduiteCk-" + sr.id).onchange = (e) => toggleConduiteModule(sr.id, e.target.checked);
    if (sr.by_theme && sr.by_theme.length) {
      const wrap = card.querySelector("#themes-" + sr.id);
      sr.by_theme.slice().sort((a, b) => themeLabel(a.theme).localeCompare(themeLabel(b.theme))).forEach(st => {
        const p = Math.round(st.correct / st.total * 100);
        wrap.appendChild(el(`<div class="theme-row">
          <span class="name">${themeLabel(st.theme)}</span>
          <span class="bar-outer"><span class="bar-inner ${progressBarClass(p)}" style="width:${p}%"></span></span>
          <span class="pct">${p}%</span>
        </div>`));
      });
    }
    container.appendChild(card);
  });

  return container;
}

/* ============================================================
   SUIVI DE FORMATION INITIALE (espace "apprenant") — module par module, d'après le référentiel
   national. Statuts fixés manuellement par le formateur, annotations privées ou visibles par
   l'apprenant selon le choix du formateur à chaque annotation.
   ============================================================ */
const TRAINING_STATUS_META = {
  a_faire: { label: "À faire", color: "var(--text-muted)" },
  en_cours: { label: "En cours", color: "var(--warning)" },
  valide: { label: "Validé", color: "var(--good)" }
};

// Bloc de contenu détaillé (issu du référentiel national) d'un sous-module, replié par défaut.
function renderSubmoduleContentBlock(content) {
  if (!content) return null;
  return el(`<details style="margin-top:6px;">
    <summary style="font-size:11.5px;font-weight:700;color:var(--blue);cursor:pointer;">Voir le contenu du référentiel</summary>
    <div class="help" style="margin-top:6px;white-space:pre-wrap;line-height:1.5;">${esc(content)}</div>
  </details>`);
}

async function goToMyTraining() {
  state.view = "myTraining";
  state.myTraining = "loading";
  render();
  const r = await rpc("app_learner_my_training", { p_token: state.auth.token });
  state.myTraining = (r && r.structure) ? r : { error: true };
  render();
}

async function goToMyFma() {
  state.view = "myFma";
  state.myFma = "loading";
  render();
  const r = await rpc("app_learner_my_fma", { p_token: state.auth.token });
  state.myFma = (r && r.structure) ? r : { error: true };
  render();
}

async function goToLearnerTraining(targetId) {
  state.view = "learnerTraining";
  state.learnerTraining = "loading";
  state.annotationForm = { open: false, moduleId: null, submoduleId: null, text: "", visibleToLearner: false, busy: false, error: null };
  render();
  const r = await rpc("app_formateur_get_learner_training", { p_token: state.auth.token, p_target_id: targetId });
  state.learnerTraining = (r && r.structure) ? Object.assign({ targetId }, r) : { error: true };
  render();
}

async function setLearnerProgress(submoduleId, status) {
  const t = state.learnerTraining;
  if (!t || t === "loading") return;
  await rpc("app_formateur_set_progress", { p_token: state.auth.token, p_target_id: t.targetId, p_submodule_id: submoduleId, p_status: status });
  goToLearnerTraining(t.targetId);
}

function openAnnotationForm(moduleId, submoduleId) {
  state.annotationForm = { open: true, moduleId, submoduleId, text: "", visibleToLearner: false, busy: false, error: null };
  render();
}
function closeAnnotationForm() { state.annotationForm.open = false; render(); }

async function submitAnnotation() {
  const f = state.annotationForm;
  const t = state.learnerTraining;
  if (!f.text.trim()) { f.error = "Le texte de l'annotation est obligatoire."; render(); return; }
  f.busy = true; f.error = null; render();
  const r = await rpc("app_formateur_add_annotation", {
    p_token: state.auth.token, p_target_id: t.targetId,
    p_module_id: f.moduleId, p_submodule_id: f.submoduleId,
    p_text: f.text.trim(), p_visible_to_learner: f.visibleToLearner
  });
  if (!r || r.error) { f.busy = false; f.error = "Impossible d'enregistrer l'annotation."; render(); return; }
  await goToLearnerTraining(t.targetId);
}

async function deleteAnnotation(annotationId) {
  const t = state.learnerTraining;
  if (!confirm("Supprimer cette annotation ?")) return;
  await rpc("app_formateur_delete_annotation", { p_token: state.auth.token, p_annotation_id: annotationId });
  goToLearnerTraining(t.targetId);
}

// Vue apprenant (lecture seule) : sa progression + uniquement les annotations qui le concernent et
// que le formateur a choisi de rendre visibles.
function renderMyTraining() {
  const container = el(`<div></div>`);
  container.appendChild(el(`<div class="page-header">${iconChip("cap", {color: ""})}<div><div class="page-title">Ma formation</div><div class="page-sub">Suivi de votre formation initiale, module par module, tenu à jour par votre formateur.</div></div></div>`));

  if (state.myTraining === "loading") {
    container.appendChild(el(`<div class="card"><div class="empty-state">Chargement…</div></div>`));
    return container;
  }
  if (!state.myTraining || state.myTraining.error) {
    container.appendChild(el(`<div class="card"><div class="empty-state">Suivi indisponible pour le moment.</div></div>`));
    return container;
  }

  const t = state.myTraining;
  const progressBySub = {};
  t.progress.forEach(p => { progressBySub[p.submodule_id] = p.status; });
  const annotByModule = {}, annotBySub = {};
  t.annotations.forEach(a => {
    if (a.submodule_id) { (annotBySub[a.submodule_id] = annotBySub[a.submodule_id] || []).push(a); }
    else if (a.module_id) { (annotByModule[a.module_id] = annotByModule[a.module_id] || []).push(a); }
  });

  if (t.structure.length === 0) {
    container.appendChild(el(`<div class="card"><div class="empty-state">Le suivi de formation initiale n'est pas encore disponible pour votre fonction.</div></div>`));
    return container;
  }

  t.structure.forEach(m => {
    const validCount = m.submodules.filter(sm => progressBySub[sm.id] === "valide").length;
    const card = el(`<div class="card" style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h3 style="margin:0;">${esc(m.label)}</h3>
        <span class="help">${validCount}/${m.submodules.length} validés</span>
      </div>
    </div>`);
    (annotByModule[m.id] || []).forEach(a => {

function renderLearnerTraining() {

    container.appendChild(el(`<div class="card" style="margin-top:10px;"><div class="empty-state">Chargement…</div></div>`));

  }
  if (!t || t.error) {

  }

  container.appendChild(el(`<div class="page-header">${iconChip("clipboard", {color: "indigo"})}<div><div class="page-title" style="margin-top:8px;">Suivi de formation — ${esc(t.target.full_name)}</div><div class="page-sub">${esc(t.target.email)} · Fonction : ${esc(niveauShortLabel(t.target.niveau))}</div></div></div>`));

  const progressBySub = {};
  t.progress.forEach(p => { progressBySub[p.submodule_id] = p.status; });
  const annotByModule = {}, annotBySub = {};
  t.annotations.forEach(a => {
    if (a.submodule_id) { (annotBySub[a.submodule_id] = annotBySub[a.submodule_id] || []).push(a); }
    else if (a.module_id) { (annotByModule[a.module_id] = annotByModule[a.module_id] || []).push(a); }
  });

  function renderAnnotationList(list) {
    const wrap = el(`<div></div>`);
    list.forEach(a => {
      const row = el(`<div class="help" style="margin-top:6px;padding:8px;background:var(--surface-1);border-radius:8px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start;">

      delBtn.onclick = () => deleteAnnotation(a.id);
      row.appendChild(delBtn);
      wrap.appendChild(row);
    });
    return wrap;
  }

  function renderInlineForm(moduleId, submoduleId) {
    const f = state.annotationForm;
    if (!f.open || f.moduleId !== moduleId || f.submoduleId !== submoduleId) return null;
    const box = el(`<div style="margin-top:8px;padding:10px;background:var(--surface-1);border-radius:8px;border:1px solid var(--border);"></div>`);
    const ta = el(`<textarea placeholder="Annotation…" style="width:100%;min-height:60px;font-family:inherit;font-size:13px;padding:8px;border-radius:7px;border:1px solid var(--border);">${esc(f.text)}</textarea>`);
    ta.oninput = (e) => { f.text = e.target.value; };
    box.appendChild(ta);
    const label = el(`<label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--text-secondary);margin-top:6px;cursor:pointer;">
      <input type="checkbox" ${f.visibleToLearner ? "checked" : ""}> Visible par l'apprenant (sinon note privée au formateur)
    </label>`);
    label.querySelector("input").onchange = (e) => { f.visibleToLearner = e.target.checked; };
    box.appendChild(label);
    if (f.error) box.appendChild(el(`<div class="empty-state" style="color:var(--critical);margin-top:6px;">${esc(f.error)}</div>`));
    const row = el(`<div style="display:flex;gap:8px;margin-top:8px;"></div>`);
    const saveBtn = el(`<button class="btn" ${f.busy ? "disabled" : ""}>${f.busy ? "Enregistrement…" : "Enregistrer"}</button>`);
    saveBtn.onclick = submitAnnotation;
    const cancelBtn = el(`<button class="btn secondary">Annuler</button>`);
    cancelBtn.onclick = closeAnnotationForm;
    row.appendChild(saveBtn); row.appendChild(cancelBtn);
    box.appendChild(row);
    return box;
  }

  if (t.structure.length === 0) {
    container.appendChild(el(`<div class="card"><div class="empty-state">Le suivi de formation initiale n'est pas encore disponible pour la fonction de cet apprenant.</div></div>`));
    return container;
  }

  t.structure.forEach(m => {
    const validCount = m.submodules.filter(sm => progressBySub[sm.id] === "valide").length;
    const card = el(`<div class="card" style="margin-bottom:12px;"></div>`);
    const header = el(`<div style="display:flex;justify-content:space-between;align-items:center;"></div>`);

    addNoteBtn.onclick = () => openAnnotationForm(m.id, null);
    header.appendChild(addNoteBtn);
    card.appendChild(header);
    card.appendChild(renderAnnotationList(annotByModule[m.id] || []));
    const inlineModuleForm = renderInlineForm(m.id, null);
    if (inlineModuleForm) card.appendChild(inlineModuleForm);

    const list = el(`<div style="margin-top:10px;"></div>`);
    m.submodules.forEach(sm => {
      const status = progressBySub[sm.id] || "a_faire";
      const row = el(`<div style="padding:8px 0;border-top:1px solid var(--border);"></div>`);
      const top = el(`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;"></div>`);
      top.appendChild(el(`<span style="font-size:13.5px;">${esc(sm.label)}</span>`));
      const btnGroup = el(`<div style="display:flex;gap:4px;"></div>`);
      Object.keys(TRAINING_STATUS_META).forEach(key => {
        const meta = TRAINING_STATUS_META[key];
        const b = el(`<button style="font-size:11px;padding:4px 8px;border-radius:6px;border:1px solid var(--border);cursor:pointer;background:${status === key ? meta.color : "var(--surface-1)"};color:${status === key ? "#fff" : "var(--text-secondary)"};font-weight:700;">${meta.label}</button>`);
        b.onclick = () => setLearnerProgress(sm.id, key);
        btnGroup.appendChild(b);
      });
      top.appendChild(btnGroup);
      row.appendChild(top);
      const noteLink = el(`<a style="font-size:11px;font-weight:700;color:var(--blue);cursor:pointer;">+ note</a>`);
      noteLink.onclick = () => openAnnotationForm(null, sm.id);
      row.appendChild(noteLink);
      row.appendChild(renderAnnotationList(annotBySub[sm.id] || []));
      const inlineSubForm = renderInlineForm(null, sm.id);
      if (inlineSubForm) row.appendChild(inlineSubForm);
      const contentBlock = renderSubmoduleContentBlock(sm.content);
      if (contentBlock) row.appendChild(contentBlock);
      list.appendChild(row);
    });
    card.appendChild(list);
    container.appendChild(card);
  });

  return container;
}

/* ============================================================
   MON PARCOURS — frise du parcours du secouriste (arrivée dans
   l'association, obtention PSE1/PSE2, recyclages FC…). Saisie
   manuelle par le formateur, sur le même principe que le suivi de
   formation initiale ci-dessus, mais sous forme d'une liste ordonnée
   et non d'un arbre modules/sous-modules.
   ============================================================ */
const PARCOURS_STATUS_META = {
  a_venir: { label: "À venir", color: "var(--text-muted)" },
  en_cours: { label: "En cours", color: "var(--warning)" },
  valide: { label: "Validé", color: "var(--good)" }
};
const PARCOURS_TYPE_LABELS = {
  arrivee: "Arrivée",
  formation_initiale: "Formation initiale",
  recyclage_fc: "Recyclage (FC)",
  autre: "Étape"
};
function formatParcoursDate(d) {
  if (!d) return "";
  const parts = String(d).split("-");
  if (parts.length !== 3) return d;
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

// Frise horizontale réutilisée à l'identique côté apprenant (accueil, lecture seule) et côté
// formateur (aperçu en tête de la vue de gestion). La première étape non validée rencontrée est mise
// en avant visuellement (halo bleu) comme "prochaine étape".
function renderParcoursFriseFromSteps(steps) {
  const frise = el(`<div class="parcours-frise"></div>`);
  let currentMarked = false;
  steps.forEach((s, i) => {
    const isCurrent = !currentMarked && s.status !== "valide";
    if (isCurrent) currentMarked = true;
    const dateLine = s.status === "valide" && s.validated_date
      ? formatParcoursDate(s.validated_date)
      : (s.target_date ? formatParcoursDate(s.target_date) : "");
    const node = el(`<div class="parcours-node ${s.status}${isCurrent ? " current" : ""}">
      <div class="pn-dot">${s.status === "valide" ? "✓" : (i + 1)}</div>
      <div class="pn-label">${esc(s.label)}</div>
      ${dateLine ? `<div class="pn-date">${esc(dateLine)}</div>` : ""}
    </div>`);
    frise.appendChild(node);
    if (i < steps.length - 1) {
      frise.appendChild(el(`<div class="parcours-connector ${s.status === "valide" ? "done" : ""}"></div>`));
    }
  });
  return frise;
}

// Carte "Mon parcours" affichée sur l'accueil de l'apprenant (jamais côté formateur, qui a sa propre
// vue de gestion accessible depuis "Mes secouristes").
function renderHomeParcoursCard() {
  const card = el(`<div class="card" style="margin-top:22px;"></div>`);
  card.appendChild(el(`<h3 style="margin:0 0 4px;">🧭 Mon parcours</h3>`));
  card.appendChild(el(`<p class="help" style="margin:0 0 6px;">De votre arrivée dans l'association jusqu'à l'obtention du PSE2, recyclages (FC) inclus. Tenu à jour par votre formateur.</p>`));

  if (state.myParcours === "loading") {
    card.appendChild(el(`<div class="empty-state">Chargement…</div>`));
    return card;
  }
  if (!state.myParcours || state.myParcours.error) {
    card.appendChild(el(`<div class="empty-state">Parcours indisponible pour le moment.</div>`));
    return card;
  }
  const steps = state.myParcours.steps || [];
  if (steps.length === 0) {
    card.appendChild(el(`<div class="empty-state">Votre formateur n'a pas encore renseigné votre parcours.</div>`));
    return card;
  }
  card.appendChild(renderParcoursFriseFromSteps(steps));
  return card;
}

async function goToLearnerParcours(targetId) {
  state.view = "learnerParcours";
  state.learnerParcours = "loading";
  state.parcoursStepForm = { open: false, targetId, editingId: null, label: "", step_type: "autre", niveau: "", status: "a_venir", target_date: "", validated_date: "", notes: "", busy: false, error: null };
  render();
  const r = await rpc("app_formateur_get_learner_parcours", { p_token: state.auth.token, p_target_id: targetId });
  state.learnerParcours = (r && r.target) ? Object.assign({ targetId }, r) : { error: true };
  render();
}

function openParcoursStepForm(targetId, step) {
  state.parcoursStepForm = {
    open: true, targetId, editingId: step ? step.id : null,
    label: step ? step.label : "", step_type: step ? step.step_type : "autre",
    niveau: step ? (step.niveau || "") : "", status: step ? step.status : "a_venir",
    target_date: step ? (step.target_date || "") : "", validated_date: step ? (step.validated_date || "") : "",
    notes: step ? (step.notes || "") : "", busy: false, error: null
  };
  render();
}
function closeParcoursStepForm() { state.parcoursStepForm.open = false; render(); }

async function saveParcoursStep() {
  const f = state.parcoursStepForm;
  if (!f.label.trim()) { f.error = "Le libellé est obligatoire."; render(); return; }
  f.busy = true; f.error = null; render();
  const params = {
    p_token: state.auth.token,
    p_label: f.label.trim(), p_step_type: f.step_type, p_niveau: f.niveau || null,
    p_status: f.status, p_target_date: f.target_date || null, p_validated_date: f.validated_date || null,
    p_notes: f.notes || null
  };
  const r = f.editingId
    ? await rpc("app_formateur_update_parcours_step", Object.assign({ p_step_id: f.editingId }, params))
    : await rpc("app_formateur_add_parcours_step", Object.assign({ p_target_id: f.targetId }, params));
  if (!r || r.error) { f.busy = false; f.error = "Impossible d'enregistrer cette étape."; render(); return; }
  await goToLearnerParcours(f.targetId);
}

async function deleteParcoursStep(targetId, stepId) {
  if (!confirm("Supprimer cette étape du parcours ?")) return;
  await rpc("app_formateur_delete_parcours_step", { p_token: state.auth.token, p_step_id: stepId });
  await goToLearnerParcours(targetId);
}

async function moveParcoursStep(targetId, steps, stepId, direction) {
  const ids = steps.map(s => s.id);
  const idx = ids.indexOf(stepId);
  const swapWith = direction === "up" ? idx - 1 : idx + 1;
  if (swapWith < 0 || swapWith >= ids.length) return;
  const tmp = ids[idx]; ids[idx] = ids[swapWith]; ids[swapWith] = tmp;
  await rpc("app_formateur_reorder_parcours_steps", { p_token: state.auth.token, p_target_id: targetId, p_step_ids: ids });
  await goToLearnerParcours(targetId);
}

  if (f.open && f.targetId === t.targetId) {
    listCard.appendChild(renderStepForm());

  if (steps.length === 0) {
    listCard.appendChild(el(`<div class="empty-state">Aucune étape pour le moment. Ajoutez la première (ex. « Arrivée dans l'association »).</div>`));

          ${s.notes ? `<div class="help" style="margin-top:2px;">${esc(s.notes)}</div>` : ""}
        </div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;" id="stepActions-${s.id}"></div>
      </div>`);

      const upBtn = el(`<button class="btn secondary" style="font-size:11px;padding:4px 8px;" ${i === 0 ? "disabled" : ""}>↑</button>`);
      upBtn.onclick = () => moveParcoursStep(t.targetId, steps, s.id, "up");
      const downBtn = el(`<button class="btn secondary" style="font-size:11px;padding:4px 8px;" ${i === steps.length - 1 ? "disabled" : ""}>↓</button>`);
      downBtn.onclick = () => moveParcoursStep(t.targetId, steps, s.id, "down");
      const editBtn = el(`<button class="btn secondary" style="font-size:11px;padding:4px 8px;">Modifier</button>`);

      const delBtn = el(`<button class="btn secondary" style="font-size:11px;padding:4px 8px;color:var(--critical);">Supprimer</button>`);

      [upBtn, downBtn, editBtn, delBtn].forEach(b => actionsWrap.appendChild(b));

    });

  container.appendChild(listCard);
  return container;
}

// Vue groupée "Formation initiale" (onglet Suivi, formateur/administrateur) : tous les modules du
// référentiel, tous les apprenants. Sélectionner un point ouvre un panneau permettant de cocher
// plusieurs apprenants et d'appliquer un statut à tous en une seule action, au lieu de les traiter
// un par un depuis "Mes secouristes".
async function goToTrainingOverview() {
  state.view = "trainingOverview";
  state.trainingOverview = "loading";
  state.trainingOverviewUI = { selectedSubmoduleId: null, selectedLearnerIds: [], busy: false, message: null };
  render();
  const r = await rpc("app_formateur_training_overview", { p_token: state.auth.token });
  state.trainingOverview = (r && r.structure) ? r : { error: true };
  render();
}

function selectSubmoduleForBulk(submoduleId) {
  const ui = state.trainingOverviewUI;
  ui.selectedSubmoduleId = (ui.selectedSubmoduleId === submoduleId) ? null : submoduleId;
  ui.selectedLearnerIds = [];
  ui.message = null;
  render();
}

function toggleBulkLearner(learnerId) {
  const ui = state.trainingOverviewUI;
  const idx = ui.selectedLearnerIds.indexOf(learnerId);
  if (idx >= 0) ui.selectedLearnerIds.splice(idx, 1);
  else ui.selectedLearnerIds.push(learnerId);
  render();
}

function toggleBulkSelectAll(eligibleIds) {
  const ui = state.trainingOverviewUI;
  const allSelected = eligibleIds.length > 0 && eligibleIds.every(id => ui.selectedLearnerIds.includes(id));
  ui.selectedLearnerIds = allSelected ? [] : eligibleIds.slice();
  render();
}

async function applyBulkTrainingStatus(status) {
  const ui = state.trainingOverviewUI;
  if (!ui.selectedSubmoduleId || ui.selectedLearnerIds.length === 0) return;
  ui.busy = true; ui.message = null; render();
  const r = await rpc("app_formateur_set_progress_bulk", {
    p_token: state.auth.token, p_target_ids: ui.selectedLearnerIds,
    p_submodule_id: ui.selectedSubmoduleId, p_status: status
  });
  ui.busy = false;
  if (!r || r.error) {
    ui.message = { error: true, text: "Impossible d'appliquer le statut. Réessayez." };
    render();
    return;
  }
  const r2 = await rpc("app_formateur_training_overview", { p_token: state.auth.token });
  if (r2 && r2.structure) state.trainingOverview = r2;
  ui.message = { error: false, text: `Statut « ${TRAINING_STATUS_META[status].label} » appliqué à ${ui.selectedLearnerIds.length} apprenant(s).` };
  render();
}

/* ============================================================
   ESPACE DOCUMENTS (mémos, fiches, vidéos par module/thème)
   ============================================================ */
function humanSize(bytes) {
  if (!bytes) return "";
  const units = ["o", "Ko", "Mo", "Go"];
  let i = 0, v = bytes;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return (i === 0 ? v : v.toFixed(1)) + " " + units[i];
}

function docIcon(doc) {
  if (doc.kind === "link") return "LIEN";
  const m = doc.mime_type || "";
  if (m.includes("pdf")) return "PDF";
  if (m.includes("word") || m.includes("document")) return "DOC";
  if (m.includes("sheet") || m.includes("excel")) return "XLS";
  if (m.includes("presentation") || m.includes("powerpoint")) return "PPT";
  if (m.indexOf("image/") === 0) return "IMG";
  if (m.indexOf("video/") === 0) return "VID";
  return "FIC";
}

function groupLabel(themeId, fonction) {
  if (fonction === "PSE1" || fonction === "PSE2" || fonction === "PSC") return themeLabel(themeId);
  return themeId;
}

function renderDocuments() {
  const container = el(`<div></div>`);
  container.appendChild(el(`<div class="page-header">${iconChip("folder", {color: "amber"})}<div><div class="page-title">Documents</div><div class="page-sub">Mémos, fiches et supports de formation, classés par module.</div></div></div>`));

  if (isFormateur()) {
    container.appendChild(renderDocFormToggleCard());
  }

  const tabsRow = el(`<div class="choice-row" style="margin-bottom:18px;"></div>`);
  visibleFonctions().forEach(fid => {
    const chip = el(`<div class="chip ${state.docFilter.fonction === fid ? "selected" : ""}">${esc(fonctionLabel(fid))}</div>`);
    chip.onclick = () => { state.docFilter.fonction = fid; render(); };
    tabsRow.appendChild(chip);
  });
  container.appendChild(tabsRow);

  if (state.documents === "loading") {
    container.appendChild(el(`<div class="card"><div class="empty-state">Chargement des documents…</div></div>`));
    return container;
  }
  if (!state.documents || state.documents.error) {
    const c = el(`<div class="card"><div class="empty-state">Impossible de charger les documents pour le moment.</div></div>`);
    const retry = el(`<button class="btn block">Réessayer</button>`);
    retry.onclick = goToDocuments;
    c.appendChild(retry);
    container.appendChild(c);
    return container;
  }

  const fonction = state.docFilter.fonction;
  const docsForFonction = state.documents.filter(d => d.fonction === fonction);
  if (docsForFonction.length === 0) {
    container.appendChild(el(`<div class="card"><div class="empty-state">Aucun document disponible pour le moment dans « ${esc(fonctionLabel(fonction))} ».</div></div>`));
    return container;
  }

  const groups = {};
  docsForFonction.forEach(d => {
    const key = d.theme || "__general";
    (groups[key] = groups[key] || []).push(d);
  });
  const keys = Object.keys(groups).sort((a, b) => {
    if (a === "__general") return 1;
    if (b === "__general") return -1;
    return groupLabel(a, fonction).localeCompare(groupLabel(b, fonction));
  });

  keys.forEach(key => {
    const label = key === "__general" ? "Général" : groupLabel(key, fonction);

async function openDocument(doc) {
  if (doc.kind === "link") { window.open(doc.url, "_blank", "noopener"); return; }
  const r = await documentsFn("download_url", { document_id: doc.id });
  if (!r || r.error || !r.url) { alert("Impossible d'ouvrir ce document pour le moment."); return; }
  window.open(r.url, "_blank", "noopener");
}

async function deleteDocument(doc) {
  if (!confirm("Supprimer « " + doc.title + " » ? Cette action est définitive.")) return;
  const r = await documentsFn("delete_file", { document_id: doc.id });
  if (!r || r.error) { alert("Impossible de supprimer ce document."); return; }
  goToDocuments();
}

function uploadFileToSignedUrl(uploadUrl, file, onProgress) {
  return new Promise((resolve, reject) => {
    const fullUrl = uploadUrl.indexOf("http") === 0 ? uploadUrl : SUPABASE_URL + uploadUrl;
    const xhr = new XMLHttpRequest();
    xhr.open("PUT", fullUrl, true);
    xhr.setRequestHeader("apikey", SUPABASE_ANON_KEY);
    xhr.setRequestHeader("Authorization", "Bearer " + SUPABASE_ANON_KEY);
    xhr.setRequestHeader("x-upsert", "false");
    xhr.setRequestHeader("Content-Type", file.type || "application/octet-stream");
    xhr.upload.onprogress = (e) => { if (e.lengthComputable && onProgress) onProgress(Math.round(e.loaded / e.total * 100)); };
    xhr.onload = () => { if (xhr.status >= 200 && xhr.status < 300) resolve(); else reject(new Error("HTTP " + xhr.status + ": " + xhr.responseText)); };
    xhr.onerror = () => reject(new Error("network"));
    xhr.send(file);
  });
}

async function submitDocForm() {
  const f = state.docForm;
  f.error = null;
  if (!f.title || !f.title.trim()) { f.error = "Merci d'indiquer un titre."; render(); return; }

  if (f.kind === "link") {
    if (!f.url || !f.url.trim()) { f.error = "Merci d'indiquer un lien."; render(); return; }
    f.busy = true; render();
    const r = await rpc("app_add_document_link", {
      p_token: state.auth.token, p_title: f.title, p_description: f.description,
      p_fonction: f.fonction, p_theme: f.theme, p_url: f.url
    });
    f.busy = false;
    if (!r || r.error) { f.error = "Impossible d'ajouter ce lien."; render(); return; }
    resetDocForm();
    goToDocuments();
    return;
  }

  if (!f.file) { f.error = "Merci de sélectionner un fichier."; render(); return; }
  if (f.file.size > 52428800) { f.error = "Ce fichier dépasse la limite de 50 Mo. Utilisez un lien externe pour les fichiers plus volumineux."; render(); return; }

  f.busy = true; f.progress = 0; render();
  const initRes = await documentsFn("init_upload", {
    title: f.title, description: f.description, fonction: f.fonction, theme: f.theme,
    file_name: f.file.name, mime_type: f.file.type || "application/octet-stream", file_size: f.file.size
  });
  if (!initRes || initRes.error || !initRes.upload_url) {
    f.busy = false;
    f.error = (initRes && initRes.message) || "Impossible de préparer l'envoi de ce fichier.";
    render();
    return;
  }
  try {
    await uploadFileToSignedUrl(initRes.upload_url, f.file, (pct) => { f.progress = pct; render(); });
  } catch (e) {
    f.busy = false;
    f.error = "Échec de l'envoi du fichier. Vérifiez votre connexion et réessayez.";
    render();
    return;
  }
  f.busy = false;
  resetDocForm();
  goToDocuments();
}
